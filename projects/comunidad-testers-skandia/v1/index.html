<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comunidad de testers Skandia</title>

  <link rel="stylesheet" href="https://skcoblobresources.blob.core.windows.net/digital-assets/icons/typography-blob/v1/sk-fonts.css">
  <link rel="stylesheet" href="https://skcoblobresources.blob.core.windows.net/digital-assets/icons/typography-blob/v1/sk-typography.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7/primeicons.css">
  <script src="https://skcostgblobresources.blob.core.windows.net/skco-lib-components/sk-components-elements.js"></script>

  <style>
    /* ── Tokens estáticos que el bundle NO define (espejo de sk-tokens.scss). NO BORRAR. ── */
    :root {
      --sk-space-zero: 0; --sk-space-xxs: 4px; --sk-space-xs: 8px; --sk-space-s: 12px; --sk-space-m: 16px;
      --sk-space-l: 24px; --sk-space-xl: 32px; --sk-space-2xl: 40px; --sk-space-3xl: 48px;
      --sk-space-4xl: 56px; --sk-space-5xl: 64px;
      --sk-radius-sm: 4px; --sk-radius-md: 8px; --sk-radius-lg: 12px; --sk-radius-pill: 9999px;
      --sk-shadow-subtle: 0 0 2px rgba(68, 68, 68, 0.15);
      --sk-shadow-surface: 0 0 2px 0 rgba(61, 75, 92, 0.15);
      --sk-shadow-raised: 0 4px 16px rgba(0, 0, 0, 0.12);
      --sk-shadow-overlay: 0 8px 24px rgba(0, 0, 0, 0.16);
      --sk-font-title: 'Montserrat', sans-serif;
      --sk-font-body: 'Open Sans', system-ui, sans-serif;
      --sk-font-weight-regular: 400; --sk-font-weight-medium: 500; --sk-font-weight-bold: 700;
      --sk-gradient-brand: linear-gradient(135deg, #00c73d 0%, #8fe000 100%);
      --sk-control-height: 48px; --sk-control-height-sm: 40px;
    }

    /* ── Colores de gráficas (guía sk-components · foundations). Se asignan en orden fijo, sin ciclar. ── */
    :root {
      --charts-c01: #a1dd70; --charts-c02: #a4d7e1; --charts-c03: #60a9a6; --charts-c04: #ff9460;
      --charts-c05: #8ba2c1; --charts-c06: #f67e7d; --charts-c07: #dddfd0; --charts-c08: #6a7491;
      --charts-c09: #de423e; --charts-c10: #95dbb7; --charts-c11: #ffbf9f; --charts-c12: #bc6995;
      --charts-c13: #d9d052; --charts-c14: #d6c09c; --charts-c15: #fecd72; --charts-c16: #cba1d2;
      --charts-c17: #c5d8a4; --charts-c18: #368cb5; --charts-c19: #00f59f; --charts-c20: #f50cc9;
      --charts-c21: #83a488; --charts-c22: #fcf9c6; --charts-c23: #b2f9fc; --charts-c24: #bf9078;
      --charts-c25: #9eb23b; --charts-c26: #73777b; --charts-c27: #ffe2e2; --charts-c28: #36d6e0;
      --charts-c29: #aba09d; --charts-c30: #b5d1ff; --charts-c31: #ecffb5; --charts-c32: #6f32c6;
      --charts-c33: #1f6feb; --charts-c34: #2e8b57; --charts-c35: #f4b400; --charts-c36: #ff5a5f;
      --charts-c37: #7b3fa1; --charts-c38: #1abc9c; --charts-c39: #f28c28; --charts-c40: #4f6d8a;
    }

    /* ── Ancho completo. NO BORRAR. ── */
    :root :is(sk-input-text, sk-input-number, sk-input-select, sk-textarea, sk-date-picker, sk-date-range-picker,
              sk-file-upload, sk-listbox, sk-form-field, sk-select-button, sk-button, sk-paginator, sk-stepper,
              sk-table, sk-alert, sk-card, sk-progress-bar):not([data-ancho="auto"]) {
      width: 100%; max-width: none; min-width: 0; box-sizing: border-box;
    }
    :root :is(sk-input-text, sk-input-select, sk-date-picker, sk-date-range-picker, sk-listbox, sk-form-field,
              sk-button, sk-alert, sk-card, sk-progress-bar):not([data-ancho="auto"]) { display: block; }
    :root :is(sk-input-number, sk-textarea, sk-file-upload):not([data-ancho="auto"]) { display: flex; }
    :root :is(.sk-input-select, .sk-listbox, .p-select, .p-listbox, .p-datepicker, .p-inputnumber, .p-fileupload) { width: 100%; max-width: none; }
    :root sk-button:not([data-ancho="auto"]):not([label]) { display: inline-block; width: auto; }
    :root sk-button:not([data-ancho="auto"])[label] .p-button { width: 100%; justify-content: center; }
    :root sk-select-button:not([data-ancho="auto"]) { display: flex; }
    :root sk-select-button:not([data-ancho="auto"]) .p-selectbutton { display: flex; width: 100%; }
    :root sk-select-button:not([data-ancho="auto"]) .p-togglebutton { flex: 1 1 0; min-width: 0; justify-content: center; }
    :root sk-form-field :is(input, select, textarea) { width: 100%; box-sizing: border-box; }

    /* ══ Capa editorial minimalista (solo tokens --sk-*) ══ */
    body { background: var(--sk-color-bg); color: var(--sk-color-text); }
    .page { max-width: 960px; margin: 0 auto; padding: var(--sk-space-2xl) var(--sk-space-m) calc(var(--sk-space-5xl) * 2);
      display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sk-space-5xl); }
    @media (min-width: 768px) { .page { padding-top: var(--sk-space-4xl); } }
    .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sk-space-m); }
    [hidden] { display: none !important; }
    .muted { color: var(--sk-color-text-muted); }

    .eyebrow { margin: 0; font-family: var(--sk-font-body); font-size: .75rem; font-weight: var(--sk-font-weight-bold);
      letter-spacing: .08em; text-transform: uppercase; color: var(--sk-color-text-muted); }
    .hero { display: grid; gap: var(--sk-space-m); }
    .hero h1 { margin: 0; font-size: clamp(2rem, 5.2vw, 3.25rem); line-height: 1.1; letter-spacing: -0.03em; max-width: 18ch; }
    .hero .lead { margin: 0; font-size: 1.125rem; line-height: 1.6; color: var(--sk-color-text-muted); }

    section.block { display: grid; gap: var(--sk-space-l); border-top: 1px solid var(--sk-color-border); padding-top: var(--sk-space-l); }
    .sec-head { display: grid; gap: var(--sk-space-s); }
    .sec-head h2 { margin: 0; font-size: clamp(1.5rem, 3.2vw, 2rem); line-height: 1.2; letter-spacing: -0.02em; }
    .sec-head p { margin: 0; line-height: 1.6; color: var(--sk-color-text-muted); }
    .sec-head p.eyebrow { line-height: 1.2; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sk-space-m); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sk-space-m); }
    .grid-2 > sk-card, .grid-3 > sk-card { height: 100%; }
    @media (max-width: 1023.98px) { .grid-3 { grid-template-columns: 1fr; } }
    @media (max-width: 767.98px) { .grid-2 { grid-template-columns: 1fr; } }

    /* franja de cifras: líneas de 1px, sin cajas ni sombras */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--sk-color-border);
      border: 1px solid var(--sk-color-border); border-radius: var(--sk-radius-lg); overflow: hidden; }
    .kpi { background: var(--sk-color-bg); padding: var(--sk-space-l); display: grid; gap: var(--sk-space-xs); align-content: start; }
    .kpi b { font-family: var(--sk-font-title); font-size: clamp(2rem, 4vw, 2.75rem); line-height: 1; letter-spacing: -0.03em;
      font-weight: var(--sk-font-weight-medium); color: var(--sk-color-text); font-variant-numeric: tabular-nums; }
    .kpi span { font-size: .875rem; line-height: 1.5; color: var(--sk-color-text-muted); }
    @media (max-width: 1023.98px) { .kpis { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 479.98px) { .kpi { padding: var(--sk-space-m); } }

    /* ── Gráficos: paleta semántica del bundle (var(--sk-color-*)) ── */
    .viz {
      --c-1: var(--charts-c01);   /* serie 1 */
      --c-2: var(--charts-c02);   /* serie 2 */
      --c-3: var(--charts-c03);   /* serie 3 */
      --c-4: var(--charts-c04);   /* serie 4 */
      --c-none: var(--charts-c07);      /* sin dato */
      --c-none-bar: var(--charts-c29);  /* barra atenuada */
      display: grid; gap: var(--sk-space-m); padding-top: var(--sk-space-xs);
    }
    .legend { display: flex; flex-wrap: wrap; gap: var(--sk-space-xs) var(--sk-space-m); font-size: .8125rem; color: var(--sk-color-text-muted); }
    .legend i { display: inline-block; box-sizing: border-box; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; border: 1px solid rgba(64, 64, 64, .15); vertical-align: -1px; }
    .note { margin: 0; font-size: .8125rem; line-height: 1.55; color: var(--sk-color-text-muted); max-width: 64ch; }

    .hbars { display: grid; gap: var(--sk-space-s); }
    .hbar { display: grid; grid-template-columns: minmax(120px, 230px) 1fr minmax(84px, auto); gap: var(--sk-space-s); align-items: center; font-size: .875rem; }
    .hbar .name { color: var(--sk-color-text); line-height: 1.35; }
    .hbar .track { height: 12px; border-left: 1px solid var(--sk-color-border); }
    .hbar .fill { height: 12px; border-radius: 0 4px 4px 0; background: var(--c-1); min-width: 2px; transition: opacity .2s; }
    .hbar:hover .fill { opacity: .8; }
    .hbar .val { color: var(--sk-color-text-muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hbar .val b { color: var(--sk-color-text); font-weight: var(--sk-font-weight-bold); }
    .hbar.dim .fill { background: var(--c-none-bar); }
    @media (max-width: 599.98px) {
      .hbar { grid-template-columns: 1fr auto; row-gap: var(--sk-space-xs); }
      .hbar .track { grid-column: 1 / -1; grid-row: 2; }
    }

    .sbar { display: flex; gap: 2px; height: 28px; }
    .sbar > div { display: flex; align-items: center; justify-content: center; font-size: .8125rem; font-weight: var(--sk-font-weight-bold);
      min-width: 0; overflow: hidden; transition: opacity .2s; }
    .sbar > div:hover { opacity: .85; }
    .sbar > div:first-child { border-radius: 4px 0 0 4px; }
    .sbar > div:last-child { border-radius: 0 4px 4px 0; }
    .sbar > div:only-child { border-radius: 4px; }
    .sbar.thin { height: 22px; }
    .srow { display: grid; grid-template-columns: minmax(120px, 190px) 1fr; gap: var(--sk-space-s); align-items: center; font-size: .875rem; }
    @media (max-width: 599.98px) { .srow { grid-template-columns: 1fr; gap: var(--sk-space-xxs); } }

    .cols { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--sk-space-s); align-items: end; height: 210px; border-bottom: 1px solid var(--sk-color-border); padding-top: 22px; }
    .col { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
    .col .tot { text-align: center; font-size: .8125rem; font-weight: var(--sk-font-weight-bold); color: var(--sk-color-text); padding-bottom: 4px; font-variant-numeric: tabular-nums; }
    .col .seg { min-height: 2px; transition: opacity .2s; }
    .col .seg:hover { opacity: .85; }
    .col .seg + .seg { margin-top: 2px; }
    .col .seg.top { border-radius: 4px 4px 0 0; }
    .col-x { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--sk-space-s); text-align: center; font-size: .8125rem; color: var(--sk-color-text-muted); margin-top: var(--sk-space-xs); }
    @media (max-width: 479.98px) { .col-x { font-size: .6875rem; gap: var(--sk-space-xxs); } .cols { gap: var(--sk-space-xs); } }

    #tip { position: fixed; z-index: 50; pointer-events: none; background: var(--sk-color-text); color: var(--sk-color-text-inverse); padding: 6px 10px;
      border-radius: var(--sk-radius-md); font-size: .8125rem; max-width: 260px; opacity: 0; transition: opacity .1s; }
    #tip.on { opacity: 1; }
    [data-tip] { cursor: default; }
    [data-tip]:focus-visible { outline: 2px solid var(--sk-color-border-focus); outline-offset: 2px; }

    /* lectura final */
    .card-title { display: flex; align-items: center; gap: var(--sk-space-xs); font-family: var(--sk-font-title); font-weight: var(--sk-font-weight-bold); margin: 0 0 var(--sk-space-m); }
    .card-title i { color: var(--sk-color-primary-active); }
    ul.clean { margin: 0; padding-left: 1.1em; display: grid; gap: var(--sk-space-s); line-height: 1.55; font-size: .9375rem; }

    /* acordeón plano: solo líneas */
    .sk-acc { border: 0; border-top: 1px solid var(--sk-color-border); border-bottom: 1px solid var(--sk-color-border); border-radius: 0; background: transparent; }
    .sk-acc summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
      padding: var(--sk-space-m) 0; font-family: var(--sk-font-title); font-weight: var(--sk-font-weight-bold); color: var(--sk-color-text); }
    .sk-acc summary::-webkit-details-marker { display: none; }
    .sk-acc summary::after { content: '\e902'; font-family: 'primeicons'; transition: transform .2s; }
    .sk-acc[open] summary::after { transform: rotate(180deg); }
    .sk-acc > :not(summary) { margin: 0 0 var(--sk-space-m); }
    .sk-acc summary:focus-visible { outline: 2px solid var(--sk-color-border-focus); outline-offset: 2px; }

    footer.nota { display: grid; gap: var(--sk-space-xs); font-size: .8125rem; line-height: 1.6; color: var(--sk-color-text-muted); }
    footer.nota b { color: var(--sk-color-text); }

    /* entrada suave al hacer scroll (solo opacity + transform) */
    .reveal { opacity: 0; transform: translateY(12px);
      transition: opacity .6s cubic-bezier(.16, 1, .3, 1) calc(var(--i, 0) * 80ms), transform .6s cubic-bezier(.16, 1, .3, 1) calc(var(--i, 0) * 80ms); }
    .reveal.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }
  </style>
</head>
<body>
  <main id="app" class="page"></main>
  <div id="tip" role="tooltip"></div>

  <template id="ui">
    <header class="topbar">
      <sk-logo style="height: 34px"></sk-logo>
      <sk-tag sk-style="info">Corte al 9 de julio de 2026</sk-tag>
    </header>

    <div class="hero reveal">
      <p class="eyebrow">Investigación UX · Comunidad de testers</p>
      <h1>Quiénes son las personas que prueban nuestros prototipos</h1>
      <p class="lead">Aquí encuentras cómo está compuesta la comunidad de 217 personas que prueban prototipos en Useberry, para que sepas a quién representan sus resultados.</p>
    </div>

    <div class="reveal" style="display:grid;gap:var(--sk-space-l)">
      <sk-alert type="info" title="En resumen" closable="false"
        message="La comunidad reúne sobre todo a personas de 25 a 44 años, clientes de Skandia y con buena autonomía digital. De cada persona conocemos poco: solo 1 de cada 3 tiene su edad registrada. Por eso las cifras sirven como orientación y todavía no permiten hablar de una muestra representativa."></sk-alert>

      <div class="kpis" aria-label="Cifras clave">
        <div class="kpi"><b>217</b><span>personas en la comunidad</span></div>
        <div class="kpi"><b>80%</b><span>son clientes de Skandia (115 de las 144 que lo informan)</span></div>
        <div class="kpi"><b>37 años</b><span>edad mediana (69 personas con edad registrada)</span></div>
        <div class="kpi"><b>97%</b><span>se sienten cómodas con lo digital (35 de las 36 que lo informan)</span></div>
      </div>
    </div>

    <section class="block reveal">
      <div class="sec-head">
        <p class="eyebrow">01 · Datos disponibles</p>
        <h2>Conocemos poco del perfil de cada persona</h2>
        <p>Cada barra muestra cuántas de las 217 personas tienen ese dato registrado. Las cifras del resto del informe se calculan sobre quienes sí lo tienen.</p>
      </div>
      <sk-card header="Datos registrados por persona" subheader="Porcentaje de las 217 personas">
        <div class="viz" id="g-cobertura"></div>
      </sk-card>
    </section>

    <section class="block reveal">
      <div class="sec-head">
        <p class="eyebrow">02 · Quiénes son</p>
        <h2>La mayoría son clientes de entre 25 y 44 años</h2>
        <p>7 de cada 10 personas con edad registrada están en ese rango. Hay pocas de 55 años o más.</p>
      </div>
      <div class="grid-2">
        <sk-card header="¿Son clientes de Skandia?" subheader="217 personas">
          <div class="viz" id="g-cliente"></div>
        </sk-card>
        <sk-card header="Estado de las invitaciones" subheader="217 personas">
          <div class="viz" id="g-invit"></div>
        </sk-card>
      </div>
      <sk-card header="Edad y relación con Skandia" subheader="69 personas con edad registrada · edad media 39,3 años · mediana 37">
        <div class="viz" id="g-edad"></div>
      </sk-card>
    </section>

    <section class="block reveal">
      <div class="sec-head">
        <p class="eyebrow">03 · Productos</p>
        <h2>Inversión y pensión obligatoria son los productos más frecuentes</h2>
        <p>Cada persona pudo mencionar varios productos. Casi 3 de cada 10 mencionan más de uno.</p>
      </div>
      <sk-card header="Productos que las personas dicen tener" subheader="65 personas con producto registrado · lo que cada persona declara">
        <div class="viz" id="g-prod"></div>
      </sk-card>
    </section>

    <section class="block reveal">
      <div class="sec-head">
        <p class="eyebrow">04 · Segmento y perfil</p>
        <h2>Tres segmentos comerciales, cada uno con su rango de edad</h2>
        <p>Privilegio se concentra entre 35 y 54 años y Joven Pro entre 25 y 34. Finanzas Personales reúne edades más variadas.</p>
      </div>
      <div class="grid-2">
        <sk-card header="Segmento y edad dentro de cada uno" subheader="39 personas con segmento · 28 con edad registrada">
          <div class="viz" id="g-seg"></div>
        </sk-card>
        <sk-card header="Perfil" subheader="16 personas con perfil asignado">
          <div class="viz" id="g-perfil"></div>
        </sk-card>
      </div>
    </section>

    <section class="block reveal">
      <div class="sec-head">
        <p class="eyebrow">05 · Género y comodidad digital</p>
        <h2>Casi todas las personas se sienten cómodas con lo digital</h2>
        <p>35 de las 36 personas que respondieron dicen usar bien las herramientas digitales. El género está registrado en 1 de cada 6 personas.</p>
      </div>
      <div class="grid-2">
        <sk-card header="Género" subheader="36 personas">
          <div class="viz" id="g-genero"></div>
        </sk-card>
        <sk-card header="Comodidad con herramientas digitales" subheader="36 personas · lo que cada persona declara">
          <div class="viz" id="g-comod"></div>
        </sk-card>
      </div>
    </section>

    <section class="block reveal">
      <div class="sec-head">
        <p class="eyebrow">06 · Cómo leer los resultados</p>
        <h2>Qué sabemos, qué aún no sabemos y qué sigue</h2>
        <p>Úsalo como guía antes de presentar o interpretar los resultados de Useberry.</p>
      </div>
      <div class="grid-3">
        <sk-card>
          <p class="card-title"><i class="pi pi-check-circle"></i>Lo que sí sabemos</p>
          <ul class="clean">
            <li>7 de cada 10 personas con edad registrada tienen entre 25 y 44 años.</li>
            <li>4 de cada 5 son clientes, entre quienes respondieron.</li>
            <li>Inversión es el producto más mencionado (43%), seguido de pensión obligatoria (31%).</li>
            <li>35 de 36 personas se sienten cómodas con lo digital.</li>
          </ul>
        </sk-card>
        <sk-card>
          <p class="card-title"><i class="pi pi-search"></i>Lo que aún no sabemos</p>
          <ul class="clean">
            <li>Con tan pocas personas de 55 años o más (8 de 69), los resultados todavía no reflejan a clientes mayores ni a quienes usan poco los canales digitales.</li>
            <li>Género, segmento y perfil tienen entre 16 y 39 personas: sirven para orientarnos.</li>
            <li>No hay personas registradas en los segmentos Elite, Wealth ni Corporativo.</li>
            <li>La base no incluye ingresos, saldos, ciudad ni nivel educativo.</li>
          </ul>
        </sk-card>
        <sk-card>
          <p class="card-title"><i class="pi pi-arrow-right"></i>Próximos pasos</p>
          <ul class="clean">
            <li><b>Completar el perfil.</b> 148 personas no tienen edad registrada y la columna de solicitud de datos está vacía en toda la base.</li>
            <li><b>Invitar a más personas</b> de 55 años o más y a no clientes de 35 años o más.</li>
            <li><b>Unificar los campos</b> de producto y segmento, que hoy llegan en texto libre.</li>
            <li><b>Indicar en cada informe</b> de Useberry a quién representan los resultados: personas adultas jóvenes, clientes y con buena autonomía digital.</li>
          </ul>
        </sk-card>
      </div>
    </section>

    <section class="reveal" style="display:grid;gap:var(--sk-space-xl)">
      <details class="sk-acc">
        <summary>Ver los datos en una tabla</summary>
        <sk-table id="datos" responsive-layout="stack" striped></sk-table>
      </details>

      <footer class="nota">
        <b>Cómo se calcularon las cifras</b>
        <span>Fuente: base de la comunidad de testers (hoja Usuarios, 217 registros, archivo del 9 de julio de 2026). Se excluyeron las hojas de prueba y las de personal interno.</span>
        <span>Los porcentajes se calculan sobre las personas que tienen el dato. Los productos se agruparon a partir de texto libre, con las erratas corregidas, y suman más de 65 porque una persona puede mencionar varios. 2 personas indicaron «referidos», que no es un producto y no se grafica.</span>
        <span>Este informe solo contiene datos agregados. No incluye nombres, correos, celulares ni información que permita identificar a alguien.</span>
      </footer>
    </section>
  </template>

  <script>
    customElements.whenDefined('sk-button').then(() => {
      const ui = document.importNode(document.getElementById('ui').content, true);
      const $ = (s) => ui.querySelector(s);
      const pct = (n, t) => Math.round((n / t) * 100);
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const tip = (t) => `data-tip="${esc(t)}" tabindex="0"`;

      /* Colores de gráfica = tokens --charts-cNN. [fondo, tinta del número] */
      const C = {
        p: ['var(--c-1)', 'var(--sk-color-text)'],         // serie 1
        i: ['var(--c-2)', 'var(--sk-color-text)'],         // serie 2
        n: ['var(--c-none)', 'var(--sk-color-text)'],      // sin dato
      };

      /* ── Datos agregados (solo conteos) ── */
      const D = {
        n: 217,
        cobertura: [['Correo de contacto', 217], ['Relación con Skandia', 144], ['Edad', 69], ['Productos', 65], ['Segmento comercial', 39], ['Género', 36], ['Comodidad digital', 36], ['Perfil', 16]],
        cliente: [['Cliente', 115, C.p], ['No cliente', 29, C.i], ['Sin dato', 73, C.n]],
        invit: [['Personas invitadas', 177, C.p], ['Por invitar', 40, C.n]],
        bandas: ['Menos de 25', '25–34', '35–44', '45–54', '55–64', '65 o más'],
        edadSi: [1, 15, 19, 11, 3, 3],
        edadNo: [1, 13, 1, 0, 2, 0],
        prod: [['Inversión (MFUND, FIC, CAT)', 28], ['Pensión obligatoria', 20], ['Crea Patrimonio', 16], ['Cesantías', 7], ['Seguros de vida', 5], ['Pensión voluntaria', 4], ['No sabe qué productos tiene', 4], ['FCO', 3]],
        seg: [['Privilegio', 14, [0, 6, 5, 0]], ['Joven Pro', 14, [7, 2, 0, 0]], ['Finanzas Personales', 11, [4, 2, 0, 2]]],
        segBandas: ['25–34', '35–44', '45–54', 'Menos de 25 o 65+'],
        perfil: [['Accumulator', 10], ['Empowered', 6]],
        genero: [['Femenino', 19, C.p], ['Masculino', 17, C.i]],
        comod: [['Mucha comodidad: usa con autonomía cualquier herramienta', 17], ['Bastante comodidad: las usa bien en general', 18], ['Algo de incomodidad: las usa con dificultad', 1]],
      };

      const hbars = (rows, total, opts = {}) =>
        `<div class="hbars">${rows.map(([name, n]) => {
          const max = opts.max || Math.max(...rows.map((r) => r[1]));
          return `<div class="hbar ${opts.dim && opts.dim(name) ? 'dim' : ''}" ${tip(`${name}: ${n} de ${total} (${pct(n, total)}%)`)}>
            <span class="name">${esc(name)}</span>
            <div class="track"><div class="fill" style="width:${(n / max) * 100}%"></div></div>
            <span class="val"><b>${n}</b> · ${pct(n, total)}%</span></div>`;
        }).join('')}</div>`;

      const sbar = (parts, total, thin) =>
        `<div class="sbar ${thin ? 'thin' : ''}" role="img" aria-label="${esc(parts.map((p) => `${p[0]} ${p[1]}`).join(', '))}">${parts.filter((p) => p[1] > 0).map(([name, n, [bg, ink]]) =>
          `<div style="flex:${n};background:${bg};color:${ink}" ${tip(`${name}: ${n} de ${total} (${pct(n, total)}%)`)}>${n / total > 0.07 ? n : ''}</div>`).join('')}</div>`;
      const legend = (items) => `<div class="legend">${items.map(([name, n, bg]) => `<span><i style="background:${bg}"></i>${esc(name)}${n != null ? ` · ${n}` : ''}</span>`).join('')}</div>`;
      const note = (t) => `<p class="note">${t}</p>`;

      /* 01 · Datos disponibles */
      $('#g-cobertura').innerHTML = hbars(D.cobertura, D.n, { max: D.n });

      /* 02 · Cliente + invitaciones */
      $('#g-cliente').innerHTML = sbar(D.cliente, D.n) + legend(D.cliente.map(([a, b, c]) => [`${a} (${pct(b, D.n)}%)`, b, c[0]])) +
        note(`Entre las 144 personas que lo informan, ${pct(115, 144)}% son clientes y ${pct(29, 144)}% no.`);
      $('#g-invit').innerHTML = sbar(D.invit, D.n) + legend(D.invit.map(([a, b, c]) => [`${a} (${pct(b, D.n)}%)`, b, c[0]])) +
        note('94% usa un correo personal (Gmail, Hotmail u Outlook) como medio de contacto.');

      /* 02 · Edad (columnas apiladas) */
      const maxCol = Math.max(...D.bandas.map((_, i) => D.edadSi[i] + D.edadNo[i]));
      const colH = (n) => (n / maxCol) * 150;
      $('#g-edad').innerHTML = legend([['Cliente', 52, 'var(--c-1)'], ['No cliente', 17, 'var(--c-2)']]) +
        `<div><div class="cols">${D.bandas.map((b, i) => {
          const si = D.edadSi[i], no = D.edadNo[i], tot = si + no;
          return `<div class="col"><div class="tot">${tot}</div>
            ${no ? `<div class="seg top" style="height:${colH(no)}px;background:var(--c-2)" ${tip(`${b}: ${no} no clientes`)}></div>` : ''}
            ${si ? `<div class="seg ${no ? '' : 'top'}" style="height:${colH(si)}px;background:var(--c-1)" ${tip(`${b}: ${si} clientes`)}></div>` : ''}</div>`;
        }).join('')}</div>
        <div class="col-x">${D.bandas.map((b) => `<span>${b}</span>`).join('')}</div></div>` +
        note('El 70% (48 de 69) tiene entre 25 y 44 años y solo 8 personas tienen 55 años o más. Las personas que no son clientes se concentran entre 25 y 34 años (13 de 17).');

      /* 03 · Productos */
      $('#g-prod').innerHTML = hbars(D.prod, 65, { max: 65, dim: (n) => n.startsWith('No sabe') }) +
        note('19 de 65 personas (29%) mencionan más de un producto. Entre quienes informan producto, 58 son clientes.');

      /* 04 · Segmento y perfil (rangos de edad = series 1 a 4) */
      const rampBg = ['var(--c-1)', 'var(--c-2)', 'var(--c-3)', 'var(--c-4)'];
      const rampInk = ['var(--sk-color-text)', 'var(--sk-color-text)', 'var(--sk-color-text)', 'var(--sk-color-text)'];
      $('#g-seg').innerHTML = legend(D.segBandas.map((b, i) => [b, null, rampBg[i]])) +
        `<div style="display:grid;gap:var(--sk-space-m)">${D.seg.map(([name, nTot, bands]) => {
          const nAge = bands.reduce((a, b) => a + b, 0);
          return `<div class="srow"><span>${esc(name)}<br><span class="note">${nTot} personas · edad en ${nAge}</span></span>
            ${sbar(bands.map((n, i) => [`${name}, ${D.segBandas[i]}`, n, [rampBg[i], rampInk[i]]]), nAge, true)}</div>`;
        }).join('')}</div>`;
      $('#g-perfil').innerHTML = hbars(D.perfil, 16, { max: 16 }) +
        note('Solo el 7% de la comunidad tiene un perfil asignado.');

      /* 05 · Género y comodidad */
      $('#g-genero').innerHTML = sbar(D.genero, 36) + legend(D.genero.map(([a, b, c]) => [`${a} (${pct(b, 36)}%)`, b, c[0]])) +
        note('Mujeres y hombres están en proporciones parecidas.');
      $('#g-comod').innerHTML = hbars(D.comod, 36, { max: 36 }) +
        note('7 de las 36 personas tienen 55 años o más: con ese número todavía no podemos hablar de comodidad digital en personas mayores.');

      /* Tabla de datos */
      const filas = [];
      const add = (grupo, rows, total) => rows.forEach(([c, n]) => filas.push({ grupo, categoria: c, n, pct: `${pct(n, total)}%`, base: total }));
      add('Relación con Skandia', D.cliente.map((r) => [r[0], r[1]]), 217);
      add('Invitaciones', D.invit.map((r) => [r[0], r[1]]), 217);
      add('Edad (rango)', D.bandas.map((b, i) => [b, D.edadSi[i] + D.edadNo[i]]), 69);
      add('Productos', D.prod, 65);
      add('Segmento comercial', D.seg.map((r) => [r[0], r[1]]), 39);
      add('Perfil', D.perfil, 16);
      add('Género', D.genero.map((r) => [r[0], r[1]]), 36);
      add('Comodidad digital', D.comod, 36);
      $('#datos').columns = [
        { field: 'grupo', header: 'Indicador' }, { field: 'categoria', header: 'Categoría' },
        { field: 'n', header: 'Personas', align: 'right' }, { field: 'pct', header: '% de la base', align: 'right' }, { field: 'base', header: 'Base', align: 'right' },
      ];
      $('#datos').value = filas;
      $('#datos').pageSize = 10;

      /* ── Tooltip ── */
      const tipEl = document.getElementById('tip');
      const place = (x, y) => { tipEl.style.left = Math.min(x + 12, innerWidth - 270) + 'px'; tipEl.style.top = Math.max(y - 38, 8) + 'px'; };
      document.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-tip]'); if (t) { tipEl.textContent = t.dataset.tip; tipEl.classList.add('on'); place(e.clientX, e.clientY); } });
      document.addEventListener('mousemove', (e) => { if (e.target.closest('[data-tip]')) place(e.clientX, e.clientY); });
      document.addEventListener('mouseout', (e) => { if (e.target.closest('[data-tip]')) tipEl.classList.remove('on'); });
      document.addEventListener('focusin', (e) => { const t = e.target.closest('[data-tip]'); if (t) { const r = t.getBoundingClientRect(); tipEl.textContent = t.dataset.tip; tipEl.classList.add('on'); place(r.left + r.width / 2, r.top); } });
      document.addEventListener('focusout', () => tipEl.classList.remove('on'));

      /* ── Montar ── */
      document.getElementById('app').append(ui);

      /* Entrada suave por scroll (IntersectionObserver) */
      const reveals = [...document.querySelectorAll('.reveal')];
      reveals.forEach((el, i) => el.style.setProperty('--i', Math.min(i, 3)));
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { threshold: 0.08 });
        reveals.forEach((el) => io.observe(el));
      } else { reveals.forEach((el) => el.classList.add('in')); }
    });
  </script>
</body>
</html>
