.cap-port .cap-resp,.cap-port .ft{position:absolute;inset:0;width:100%;height:100%;z-index:-3;background:transparent}
.cap-port .ft{z-index:-2}
.cap-port .ft .ft-ph{display:none}
.cap-port .ft img{object-position:50% 30%}
.cap-port .ft-pend{left:auto;right:8px;bottom:auto;top:8px}
.cap-pv{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,22,13,.92) 0,rgba(6,22,13,.74) 42%,rgba(6,22,13,.18) 100%)}
.cap-port .ch{font:700 11.5px/16px var(--tit);letter-spacing:.04em;color:#e6efe8}
.cap-port b{font:700 18px/22px var(--tit);letter-spacing:-.012em;color:#3fe26c;max-width:54%;text-wrap:balance}
.cap-port .lm{font:600 12.5px/17px var(--tit);color:#fff}
.cap-port .pl{position:absolute;left:66%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff;color:#0e2017;display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(0,0,0,.6)}
.cap-port .pl .ic{width:20px;height:20px;stroke-width:2.2}
.cap-port em{position:absolute;right:10px;bottom:10px;font:600 12px/18px var(--tit);font-style:normal;padding:3px 10px;border-radius:8px;background:rgba(8,20,13,.86);color:#fff}
.cap-pie{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 16px}
.cap-pie b{display:block;font:700 15px/20px var(--tit);color:var(--sk-tinta)}
.cap-pie small{font-size:12px;line-height:16px;color:var(--sk-tx2)}
.cap-vi{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;border:0;background:none;font:700 13.5px/1 var(--tit);color:var(--sk-tinta)}
.cap-vi i{width:30px;height:30px;border-radius:50%;border:2px solid var(--sk-verde);color:var(--sk-verde-tx);display:grid;place-items:center}
.cap-vi i .ic{width:14px;height:14px;stroke-width:2.4}
.cap-fila{display:flex;gap:12px;overflow-x:auto;margin:0 -22px;padding:2px 22px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.cap-fila::-webkit-scrollbar{display:none}
.cap-fila .cap-card{flex:0 0 86%;scroll-snap-align:center}
/* Historia */
.cap-st{flex:1 0 auto;position:relative;display:flex;flex-direction:column;min-height:100%;overflow:hidden;isolation:isolate;background:#024725;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cap-st>.cap-resp,.cap-st>.ft{position:absolute;inset:0;width:100%;height:100%;z-index:-3;background:transparent}
.cap-st>.ft{z-index:-2}
.cap-st>.ft .ft-ph{display:none}
.cap-st>.ft img{object-position:50% 28%}
.cap-st>.ft-pend,.cap-st .ft-pend{left:auto;right:12px;bottom:auto;top:calc(var(--sbh) + 96px)}
.cap-velo{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,18,11,.66) 0,rgba(6,18,11,.3) 26%,rgba(6,18,11,.34) 48%,rgba(6,18,11,.84) 78%,rgba(6,18,11,.94) 100%)}
.cap-top{position:relative;z-index:3;padding:calc(var(--sbh) + 6px) 22px 0;display:grid;gap:14px;pointer-events:none}
.cap-top button{pointer-events:auto}
.cap-seg{display:flex;gap:5px}
.cap-seg i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.34);overflow:hidden;position:relative}
.cap-seg i.h{background:var(--sk-verde)}
.cap-seg i.a::after{content:"";position:absolute;inset:0;background:var(--sk-verde);transform-origin:left center;animation:cap-llena 5s linear both}
.cap-st.pausa .cap-seg i.a::after{animation-play-state:paused}
@keyframes cap-llena{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cap-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;font:600 13.5px/18px var(--tit)}
.cap-cab span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap-cab button{width:44px;height:44px;margin:-10px -12px -10px 0;border:0;background:none;color:#fff;display:grid;place-items:center}
.cap-cab .ic{width:22px;height:22px;stroke-width:2}
.cap-top .logo{height:22px;width:auto;color:#fff;justify-self:start}
.cap-top .logo path[fill="#00C73D"]{fill:#fff}
.cap-z{position:absolute;top:calc(var(--sbh) + 110px);bottom:150px;border:0;background:none;z-index:2}
.cap-z.izq{left:0;width:30%}
.cap-z.der{right:0;width:70%}
.cap-frase{position:relative;z-index:1;margin-top:auto;padding:0 26px calc(var(--hih) + 46px);font:700 26px/33px var(--tit);letter-spacing:-.015em;text-wrap:balance;pointer-events:none}
.e .cap-frase{animation:g-apa .3s var(--sale) both}
.cap-fin{position:relative;z-index:3;margin-top:auto;padding:0 22px calc(var(--hih) + 18px);display:grid;gap:12px}
.cap-fin .cap-port{border-radius:20px}
.cap-tt{display:grid;gap:2px;padding:0 2px}
.cap-tt b{font:700 17px/22px var(--tit)}
.cap-tt span{font-size:13px;line-height:18px;color:#d8e4da}
.cap-fin .btn.pri{box-shadow:none}
.cap-pil{position:relative;z-index:3;margin-top:auto;padding:0 24px calc(var(--hih) + 18px);display:grid;gap:12px}
.cap-pil .cap-frase{margin:0;padding:0;font-size:22px;line-height:28px;pointer-events:auto}
.cap-pil cite{font-style:normal;font-size:11.5px;line-height:16px;color:#cfdcd2}
.cap-pil>p{font-size:15px;line-height:22px;color:#f2f6f3}
.cap-pil>div{display:grid;gap:3px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}
.cap-pil>div b{font:700 12px/16px var(--tit);color:#b9f26a}
.cap-pil>div p{font-size:14px;line-height:20px}
.cap-pil .btn{margin-top:4px}
/* Cápsula completa */
.cap-tiempo{display:grid;gap:6px}
.cap-barra{height:8px;border-radius:4px;background:#2a2f2b;position:relative}
.cap-barra i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--sk-verde);transition:width .9s linear}
.cap-barra i::after{content:"";position:absolute;right:-8px;top:-4px;width:16px;height:16px;border-radius:50%;background:var(--sk-verde);box-shadow:0 0 0 3px #fff}
.cap-tiempo .k-kv{font:600 12.5px/18px var(--tit);color:var(--sk-tx2);margin-top:4px}
.cap-caps{display:grid}
.cap-caps button{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;min-height:54px;padding:0 2px;border:0;border-bottom:1px solid var(--sk-linea);background:none;text-align:left;font:600 15px/20px var(--tit);color:var(--sk-tinta)}
.cap-caps time{font:700 14px/20px var(--tit);color:var(--sk-tx2);font-variant-numeric:tabular-nums}
.cap-caps button[aria-current="true"] time{color:var(--sk-verde-tx)}
@media (prefers-reduced-motion:reduce){
  .cap-seg i.a::after{animation:none}
  .e .cap-frase{animation:none}
  .cap-barra i{transition:none}
}

/* Hitos del plan (línea de tiempo horizontal) */
.hitos{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;position:relative;padding-top:4px}
.hitos li{position:relative;display:grid;gap:1px;padding-top:24px;text-align:center}
.hitos li:first-child{text-align:left}
.hitos li:last-child{text-align:right}
.hitos li::before{content:"";position:absolute;top:8px;left:0;right:0;height:3px;background:var(--sk-des)}
.hitos li.h::before{background:var(--sk-verde)}
.hitos li.a::before{background:linear-gradient(90deg,var(--sk-verde) 50%,var(--sk-des) 50%)}
.hitos li:first-child.a::before{background:var(--sk-des)}
.hitos li::after{content:"";position:absolute;top:2px;left:50%;margin-left:-7.5px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--sk-linea2)}
.hitos li:first-child::after{left:0;margin-left:0}
.hitos li:last-child::after{left:auto;right:0}
.hitos li.h::after{background:var(--sk-verde);border-color:var(--sk-verde)}
.hitos li.a::after{border-color:var(--sk-verde);box-shadow:0 0 0 4px var(--sk-menta)}
.hitos b{font:700 12.5px/17px var(--tit);color:var(--sk-tinta)}
.hitos span{font-size:11.5px;line-height:15px;color:var(--sk-tx2)}
/* Avance de una meta */
.av-g{position:relative;display:grid;gap:8px;padding-top:22px}
.av-h{position:absolute;top:0;width:0;height:36px;border-left:2px dashed var(--sk-tx2);font-style:normal}
.av-h span{position:absolute;left:6px;top:-2px;font:600 11px/14px var(--tit);color:var(--sk-tx2);white-space:nowrap}
.av-l{display:flex;justify-content:space-between;gap:10px;font:600 12px/16px var(--tit);color:var(--sk-tx2)}
.av-l span{display:inline-flex;align-items:center;gap:6px}
.av-l i.c{width:10px;height:10px;border-radius:3px}
/* Brecha: dos barras y lo que falta entre las dos */
.brecha{display:grid;gap:12px}
.brecha>div{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:baseline}
.brecha span{font:600 12.5px/17px var(--tit);color:var(--sk-tx2)}
.brecha b{font:700 15px/20px var(--tit);color:var(--sk-tinta);font-variant-numeric:tabular-nums}
.brecha>div>i{grid-column:1/-1;display:flex;height:30px;border-radius:9px;overflow:hidden;font-style:normal}
.brecha i.t{background:#232323}
.brecha i.p>i{background:var(--sk-verde);border-radius:9px 0 0 9px}
.brecha i.p>em{font-style:normal;display:grid;place-items:center;background:repeating-linear-gradient(135deg,#eef9d6 0 6px,#dff3b0 6px 12px);border:1.5px dashed #6b8f1a;border-left:0;border-radius:0 9px 9px 0;min-width:0}
.brecha u{text-decoration:none;font:700 11.5px/1 var(--tit);color:#33480a;white-space:nowrap;padding:0 4px}
/* Compatibilidad con plantillas heredadas de la v1 (composición del portafolio y áreas del índice) */
.ap2{display:grid;gap:10px}
.ap2 .f{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;font:600 12px/16px var(--tit);color:var(--sk-tx2)}
.ap2 .b{display:flex;height:30px;border-radius:9px;overflow:hidden;background:var(--sk-des)}
.ap2 .b i{display:grid;place-items:center;height:100%;font:700 11px/1 var(--tit);font-style:normal;color:#fff;transition:width .4s var(--sale)}
.c-rf{background:#1f5f8b} .c-ac{background:#5a6b7b} .c-li{background:#8fe000;color:#232323!important} .c-in{background:#02842a}
.ap2-l{display:grid;gap:6px;font-size:14px}
.ap2-l li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}
.ap2-l li i{width:12px;height:12px;border-radius:3px}
.ap2-l li b{font-variant-numeric:tabular-nums;color:var(--sk-tinta)}
.pilares{display:grid;gap:10px}
.pilares li{display:grid;grid-template-columns:132px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.pilares .b{height:10px;border-radius:5px;background:var(--sk-des)}
.pilares .b i{display:block;height:100%;border-radius:5px;background:var(--sk-tx2)}
.pilares li.max .b i{background:var(--sk-verde)}
.pilares b{text-align:right;font-variant-numeric:tabular-nums;color:var(--sk-tinta)}
.portal-h{padding:calc(var(--sbh) + 6px) 22px 12px;display:flex;flex-direction:column;gap:2px}
.brecha .br-f{display:flex;align-items:center;gap:8px;font:600 13px/18px var(--tit);color:var(--sk-tinta)}
.brecha .br-f i{width:18px;height:12px;border-radius:3px;background:repeating-linear-gradient(135deg,#eef9d6 0 4px,#cfe98f 4px 8px);border:1.5px dashed #6b8f1a}
.brecha .br-f b{font:700 14px/18px var(--tit)}
.mail-de>*{grid-column:2}
.mail-de .av{grid-column:1;grid-row:1/span 3}
.mail-de time{grid-column:3;grid-row:1}

/* ───────── Aporte recurrente: nómina primero ───────── */
.rec{display:grid;gap:10px}
.rec-op{display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;align-items:center;width:100%;padding:14px 16px;border:1.5px solid var(--sk-linea);border-radius:16px;background:var(--sk-sup);box-shadow:var(--sk-sombra);text-align:left;color:var(--sk-tinta);transition:transform .12s var(--sale),border-color .15s}
.rec-op:active{transform:scale(.98)}
.rec-op.a{border-color:var(--sk-verde);background:var(--sk-grad-l);box-shadow:none;padding-block:18px}
.rec-op .oi{grid-row:1/span 2;width:44px;height:44px;border-radius:12px;background:var(--sk-verde-l);color:var(--sk-verde-tx);display:grid;place-items:center}
.rec-op.a .oi{background:var(--sk-verde);color:#fff}
.rec-op .oi .ic{width:24px;height:24px}
.rec-op b{font:700 16px/22px var(--tit)}
.rec-op em{font-style:normal;font:700 11.5px/18px var(--tit);padding:1px 10px;border-radius:100px;background:var(--sk-lima);color:#0e2017;white-space:nowrap}
.rec-op small{grid-column:2/-1;font-size:13px;line-height:18px;color:var(--sk-tx2)}
.rec .ruta-t+.ruta-t{margin-top:0}
.carta{position:relative;display:grid;gap:12px;padding:20px 20px 18px;border:1px solid var(--sk-linea);border-radius:6px 22px 6px 6px;background:linear-gradient(180deg,#fff,#fbfcfb);box-shadow:0 2px 10px -3px rgba(61,75,92,.28),0 0 4px 0 rgba(61,75,92,.12)}
.carta::after{content:"";position:absolute;top:-1px;right:-1px;width:24px;height:24px;background:linear-gradient(225deg,#fff 50%,#e3e8e3 50%);border-radius:0 22px 0 6px;border-left:1px solid var(--sk-linea);border-bottom:1px solid var(--sk-linea)}
.carta>b{font:700 14px/20px var(--tit);color:var(--sk-tinta);padding-bottom:10px;border-bottom:1px solid var(--sk-linea);padding-right:24px}
.carta dl{display:grid;gap:8px}
.carta dl div{display:grid;grid-template-columns:104px 1fr;gap:10px;font-size:13px;line-height:18px}
.carta dt{color:var(--sk-tx2)}
.carta dd{font-weight:600;color:var(--sk-tinta)}
/* ───────── Ajustes de la revisión final ───────── */
.cap-top{grid-template-columns:minmax(0,1fr)}
.ruta-av div b{font:inherit;color:inherit}
.app-nav button{color:#666}
.app-tabs .on{color:#0e2017}
.ruta>li>h3::before{color:#0e2017}
.k-tag.ok,.k-tag.marca,.k-et{color:#016a22}
.k-in::placeholder,.ab-campo input::placeholder{color:#6f766f}

/* ───────── En el tiempo: cinta del corte, gráfica de dos capas, tarjeta de meta, movimientos ───────── */
.salto.cinta{border-style:solid;border-color:var(--marca);background:var(--marca-suave);color:var(--marca-tx);font:700 13px/18px var(--tit);border-radius:100px;padding:7px 14px}
.capas-l{display:grid;gap:6px}
.capas-l span{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13px;line-height:18px;color:var(--sk-tx)}
.capas-l i{width:12px;height:12px;border-radius:3px}
.capas-l b{font:700 13.5px/18px var(--tit);color:var(--sk-tinta);font-variant-numeric:tabular-nums}
.meta-c{display:grid;gap:10px;width:100%;padding:16px;border:1px solid var(--sk-linea);border-radius:16px;background:var(--sk-sup);box-shadow:var(--sk-sombra);text-align:left;color:var(--sk-tx);transition:transform .12s var(--sale),border-color .15s}
.meta-c:active{transform:scale(.985)}
.meta-c:hover{border-color:var(--sk-verde)}
.meta-c .meta-t{display:grid}
.meta-c .k-prog,.meta-c .k-kv{display:flex}
.meta-c .k-prog{display:block}
.meta-c>em{font-style:normal;display:inline-flex;align-items:center;gap:6px;font:700 13px/18px var(--tit);color:var(--sk-verde-tx)}
.meta-c>em .ic{width:16px;height:16px}
.meta-c+.meta-c{margin-top:-6px}
.movs{display:grid;border:1px solid var(--sk-linea);border-radius:16px;background:var(--sk-sup);box-shadow:var(--sk-sombra);overflow:hidden}
.movs li{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--sk-linea)}
.movs li:last-child{border-bottom:0}
.movs li>i{width:36px;height:36px;border-radius:12px;background:var(--sk-verde-l);color:var(--sk-verde-tx);display:grid;place-items:center}
.movs li>i .ic{width:19px;height:19px}
.movs b{display:block;font:600 14px/19px var(--tit);color:var(--sk-tinta)}
.movs small{font-size:12px;line-height:16px;color:var(--sk-tx2)}
.movs em{font-style:normal;font:700 14px/19px var(--tit);color:var(--sk-tinta);font-variant-numeric:tabular-nums;white-space:nowrap}
.hito{gap:6px}
.ix-comp{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.ix-comp div{display:grid;gap:2px}
.ix-comp b{font:700 24px/30px var(--tit);color:var(--sk-tx2);font-variant-numeric:tabular-nums}
.ix-comp b.k-num{font-size:32px;line-height:38px;color:var(--sk-tinta)}
.ix-comp .ic{width:24px;height:24px;color:var(--sk-verde-tx);margin-bottom:8px}
.ix-ar{display:grid;gap:12px}
.ix-ar li{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:baseline;font-size:13.5px;line-height:18px;color:var(--sk-tx)}
.ix-ar li>i{grid-column:1/-1;grid-row:2;position:relative;height:10px;border-radius:5px;background:var(--sk-des);overflow:hidden}
.ix-ar li>i>i{position:absolute;top:0;bottom:0;left:0;background:#8a918b;border-radius:5px 0 0 5px}
.ix-ar li>i>i.n{background:var(--sk-verde);border-radius:0}
.ix-ar b{font:700 13.5px/18px var(--tit);color:var(--sk-tinta);font-variant-numeric:tabular-nums}
.ix-ar li.sube span{font-weight:700;color:var(--sk-tinta)}
.ix-ar li.sube b{color:var(--sk-verde-tx)}
.capas-m{display:grid;gap:6px;padding-top:4px}
.capas-m>div{display:flex;gap:8px;align-items:stretch}
.capas-m i{flex:1;display:grid;grid-template-rows:26px 12px auto;font-style:normal;justify-items:center}
.capas-m u{grid-row:1;align-self:end;width:100%;max-width:26px;border-radius:4px 4px 0 0;background:#8fe000;text-decoration:none}
.capas-m i.baja u{grid-row:2;align-self:start;border-radius:0 0 4px 4px;background:#8a918b;max-height:12px}
.capas-m i::before{content:"";grid-row:1;grid-column:1;align-self:end;width:100%;border-bottom:1px solid var(--sk-linea2)}
.capas-m u{grid-column:1}
.capas-m em{grid-row:3;font-style:normal;font:600 10.5px/14px var(--tit);color:var(--sk-tx2)}
#col-persona{overflow-x:hidden;padding-inline:4px}
@media (max-width:767px){#col-persona{padding-inline:0}}

/* ───────── Tips livianos ───────── */
.tip-e{display:grid;justify-items:center;gap:4px;max-width:30ch;margin-top:14px;text-align:center;animation:g-apa .2s ease both}
.tip-e>b{font:700 12px/16px var(--tit);color:var(--sk-verde-tx)}
.tip-e>p{font:400 15px/22px var(--cue);color:#404040}
.tip-e>small{font-size:12px;line-height:17px;color:var(--sk-tx2);animation:g-apa .2s ease both}
.tip-i{display:inline-grid;place-items:center;width:20px;height:20px;margin-left:2px;vertical-align:2px;border:1.5px solid var(--sk-linea2);border-radius:50%;background:none;color:var(--sk-tx2);font:700 11px/1 var(--tit);font-style:italic;position:relative}
.tip-i::after{content:"";position:absolute;inset:-12px}
.tip-i[aria-expanded="true"]{border-color:var(--sk-verde);color:var(--sk-verde-tx)}
.tip-p{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;min-height:32px;padding:0 12px 0 8px;border:1px solid var(--sk-linea2);border-radius:100px;background:var(--sk-sup);color:var(--sk-tinta);font:600 13px/1 var(--tit);position:relative;transition:transform .12s var(--sale),border-color .15s}
.tip-p::after{content:"";position:absolute;inset:-6px 0}
.tip-p:active{transform:scale(.96)}
.tip-p:hover{border-color:var(--sk-verde)}
.tip-p .ic{width:16px;height:16px;color:var(--sk-verde-tx)}
.tip-app2{display:grid;gap:2px;padding:12px 14px;border-radius:14px;background:var(--sk-verde-l);border:1px solid #dff3dc}
.tip-app2 b{font:700 12px/16px var(--tit);color:var(--sk-verde-tx)}
.tip-app2 p{font-size:14px;line-height:20px;color:var(--sk-tinta)}
.hoja-x{position:absolute;top:8px;right:10px;width:44px;height:44px;border:0;background:none;color:var(--sk-tx2);display:grid;place-items:center}
/* ───────── Resultado del perfil ───────── */
.pf-foto{position:relative;height:220px;border-radius:22px;overflow:hidden;isolation:isolate;background:#024725;flex:none}
.pf-foto .ft{position:absolute;inset:0;background:transparent}
.pf-foto .ft .ft-ph{display:none}
.pf-foto .ft img{object-position:50% 50%}
.pf-foto .ft-pend{left:auto;right:10px;bottom:auto;top:10px}
.pf-velo{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(6,18,11,.1) 0,rgba(6,18,11,.12) 42%,rgba(6,18,11,.82) 100%)}
.pf-foto svg{position:absolute;inset:0;width:100%;height:100%;z-index:2;overflow:visible}
.pf-l{fill:none;stroke:#8fe000;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:100;stroke-dashoffset:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.pf-pt{position:absolute;z-index:3;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#8fe000;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 2px 6px rgba(0,0,0,.4)}
.pf-tx{position:absolute;z-index:3;left:18px;right:18px;bottom:14px;display:grid;gap:0;color:#fff}
.pf-tx small{font:600 13px/18px var(--tit);opacity:.95}
.pf-tx b{font:700 30px/36px var(--tit);letter-spacing:-.02em}
.pf-esc{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:100px;background:var(--sk-gris);isolation:isolate}
.pf-esc>i{position:absolute;z-index:-1;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:100px;background:var(--sk-verde);transform:translateX(calc(var(--x)*100%))}
.pf-esc span{display:grid;place-items:center;min-height:36px;font:600 12.5px/1 var(--tit);color:var(--sk-tx2)}
.pf-esc span.a{color:#0e2017;font-weight:700}
.pf-ras{display:grid;gap:8px}
.pf-ras li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center}
.pf-ras li>i{width:40px;height:40px;border-radius:12px;background:var(--sk-verde-l);border:1px solid #dff3dc;color:var(--sk-verde-tx);display:grid;place-items:center}
.pf-ras li>i .ic{width:22px;height:22px}
.pf-ras span{font-size:14px;line-height:20px;color:var(--sk-tx)}
.pf-ras b{margin-left:6px;font:700 14px/20px var(--tit);color:var(--sk-tinta)}
.pf-ras b::before{content:"· ";font-weight:400;color:var(--sk-tx2)}
/* entrada: fundido con leve escala de la foto, línea que se dibuja, punto que late una vez, marcador que se desliza y rasgos escalonados */
#pant>.e.entra:has(.pf-foto){animation:aparece2 .3s ease both}
@keyframes aparece2{from{opacity:0}}
.e.entra .pf-foto .ft{animation:pf-foto .3s var(--sale) both}
.e.entra .pf-l{animation:pf-linea .9s .25s var(--sale) both}
.e.entra .pf-pt{animation:pf-punto .7s 1.1s ease-out both}
.e.entra .pf-esc>i{animation:pf-marca .3s 1.15s var(--sale) both}
.e.entra .pf-esc span.a{animation:pf-rot .01s 1.3s both}
.e.entra .pf-ras li{animation:pf-rasgo .3s calc(1.3s + var(--i)*80ms) var(--sale) both}
@keyframes pf-foto{from{transform:scale(1.04)}}
@keyframes pf-linea{from{stroke-dashoffset:100}}
@keyframes pf-punto{0%{opacity:0;transform:scale(.3)}45%{opacity:1;transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes pf-marca{from{transform:translateX(100%);opacity:.4}}
@keyframes pf-rot{from{color:var(--sk-tx2)}}
@keyframes pf-rasgo{from{opacity:0;transform:translateY(8px)}}
/* encabezado: nunca se corta, aunque el teléfono quede angosto */
.tel-pant{container-type:inline-size}
.k{min-width:0;max-width:100%}
.k-bar{grid-template-columns:44px minmax(0,1fr) auto}
.k-bar .logo{max-width:100%}
.k-ib.ayuda{white-space:nowrap}
.k-cuerpo{min-width:0}
.k-h1,.k-h2{overflow-wrap:break-word}
@container (max-width:330px){.k-ib.ayuda span{display:none}.k-ib.ayuda{padding:0 10px}.k-cuerpo{padding-left:18px;padding-right:18px}.k-fin{margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}}
@media (prefers-reduced-motion:reduce){
  .tip-e,.tip-e>small{animation:none}
  #pant>.e.entra:has(.pf-foto){animation:aparece .15s linear}
  .e.entra .pf-foto .ft,.e.entra .pf-l,.e.entra .pf-pt,.e.entra .pf-esc>i,.e.entra .pf-esc span.a,.e.entra .pf-ras li{animation:none}
}

/* ───────── v2.1 ───────── */
/* Inicio con «Tus productos», «Tu siguiente paso» y «Para ti» */
.app-sec{display:grid;gap:10px}
.filas-p{display:grid;border:1px solid var(--sk-linea);border-radius:16px;background:var(--sk-sup);box-shadow:var(--sk-sombra);overflow:hidden}
.fila-p,.fila-o{display:grid;grid-template-columns:40px 1fr auto;gap:2px 12px;align-items:center;width:100%;min-height:64px;padding:11px 14px;border:0;border-bottom:1px solid var(--sk-linea);background:none;text-align:left;color:var(--sk-tx)}
.filas-p>:last-child{border-bottom:0}
.fila-p{transition:background-color .15s}
.fila-p:active{background:var(--sk-verde-l)}
.fila-p .oi,.fila-o .oi,.paso-c .oi{width:40px;height:40px;border-radius:12px;background:var(--sk-verde-l);color:var(--sk-verde-tx);display:grid;place-items:center}
.fila-o .oi{background:var(--sk-gris);color:var(--sk-tx)}
.fila-p .oi .ic,.fila-o .oi .ic,.paso-c .oi .ic{width:21px;height:21px}
.fila-p span b,.fila-o span b,.paso-c span b{display:block;font:700 14.5px/20px var(--tit);color:var(--sk-tinta)}
.fila-p span small,.fila-o span small,.paso-c span small{display:block;font-size:12.5px;line-height:17px;color:var(--sk-tx2)}
.fila-p .sal{font:700 15px/20px var(--tit);color:var(--sk-tinta);font-variant-numeric:tabular-nums;white-space:nowrap}
.fila-p .et,.fila-o .et{font-style:normal;font:600 11.5px/18px var(--tit);padding:1px 10px;border-radius:100px;background:var(--sk-verde-l);color:var(--sk-verde-tx);white-space:nowrap}
.fila-p .et.esp{background:var(--sk-warn-bg);color:var(--sk-warn-tx)}
.fila-p.esp{grid-template-columns:40px 1fr auto auto}
.fila-o .btn,.fila-p .btn{width:auto;min-height:36px;padding:4px 14px;font-size:13px}
.paso-c{display:grid;grid-template-columns:40px 1fr 20px;gap:12px;align-items:center;width:100%;padding:14px;border:1px solid #dff3dc;border-radius:16px;background:var(--sk-grad-l);text-align:left;color:var(--sk-tx)}
.paso-c>.ic{color:var(--sk-verde-tx)}
.arranque{display:grid;gap:10px;padding:14px 16px;border:1px solid var(--sk-linea);border-radius:16px;background:var(--sk-sup);box-shadow:var(--sk-sombra)}
.arr-cab{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.arr-cab svg{width:44px;height:44px}
.arr-cab b{display:block;font:700 16px/22px var(--tit);color:var(--sk-tinta)}
.arr-cab small{font:600 13px/18px var(--tit);color:var(--sk-verde-tx)}
.arranque ul{display:grid}
.arranque li{border-top:1px solid var(--sk-linea)}
.arranque li.h,.arranque li button{display:grid;grid-template-columns:22px 1fr 18px;gap:10px;align-items:center;width:100%;min-height:44px;padding:6px 0;border:0;background:none;text-align:left;font:600 14px/20px var(--tit);color:var(--sk-tinta)}
.arranque li.h{color:var(--sk-tx2);font-weight:500}
.arranque li.h>.ic{color:var(--sk-verde);width:20px;height:20px;stroke-width:2.4}
.arranque li button>i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--sk-linea2)}
.arranque li button>.ic{color:var(--sk-verde-tx);width:16px;height:16px}
.app-cab .ics button{display:grid;place-items:center;width:44px;height:44px;margin:-10px -10px -10px -8px;border:0;background:none;color:var(--sk-tinta)}
/* Molde de plata: cifra, fichas, tabla de revisión y error en línea */
.plata{display:grid;justify-items:center;gap:2px;padding:6px 0 2px;text-align:center}
.plata .k-num.mal{color:var(--sk-err-tx)}
.plata-err{font:600 13px/18px var(--tit);color:var(--sk-err-tx)}
.k-chips.cen{justify-content:center}
.revision{display:grid;border:1px solid var(--sk-linea);border-radius:16px;background:var(--sk-sup);padding:2px 16px}
.revision div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--sk-linea);font-size:14px;line-height:20px}
.revision div:last-child{border-bottom:0}
.revision dt{color:var(--sk-tx2);white-space:nowrap}
.revision dd{font-weight:600;color:var(--sk-tinta);text-align:right}
.k-num.conf{font-size:24px;line-height:30px;overflow-wrap:anywhere}
/* Hoja de resultado única: chulo, reloj o equis, una frase y un botón */
#toast{top:auto;left:0;right:0;bottom:0;z-index:46;display:grid;grid-template-columns:44px 1fr;gap:12px 14px;align-items:center;padding:22px 22px calc(var(--hih) + 14px);border-radius:28px 28px 0 0;background:var(--sk-sup);color:var(--sk-tinta);box-shadow:0 -10px 34px -10px rgba(0,0,0,.3);font:600 16px/22px var(--tit);animation:res-sube .28s var(--sale) both}
#toast::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:900px;background:rgba(10,22,15,.32);animation:g-apa .2s ease both}
#toast span{flex:none}
#toast .btn{grid-column:1/-1;min-height:46px;min-width:0;border:1.5px solid var(--sk-verde);color:var(--sk-verde-tx);background:var(--sk-sup)}
.res-i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sk-ok-bg);color:#016a22}
.res-i .ic{width:24px;height:24px;stroke-width:2.4}
.res-i.reloj{background:var(--sk-warn-bg);color:var(--sk-warn-tx)}
.res-i.err{background:var(--sk-err-bg);color:var(--sk-err-tx)}
.res-pant{display:grid;gap:12px;justify-items:start}
@keyframes res-sube{from{transform:translateY(60%);opacity:0}}
/* Ficha con orden fijo: riesgo en escala y composición en barras */
.riesgo{display:flex;gap:5px}
.riesgo i{flex:1;height:10px;border-radius:5px;background:var(--sk-des)}
.riesgo i.h{background:#e08a00}
.inv-b{display:grid;gap:6px}
.inv-b p{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;line-height:19px;color:var(--sk-tx)}
.inv-b p b{font:700 13.5px/19px var(--tit);color:var(--sk-tinta)}
.inv-b span{height:12px;border-radius:6px;background:var(--sk-des);overflow:hidden;margin-bottom:4px}
.inv-b span i{display:block;height:100%;border-radius:6px;background:var(--sk-verde)}
.rec-acc{display:flex;gap:18px;padding:0 4px;margin-top:-4px}
.rec-acc .k-lk{font-size:13.5px;color:var(--sk-verde-tx);text-decoration:none;font-weight:700}
/* El bloque fijo de botones no esconde lo último: degradado más largo y acciones secundarias compactas */
.k-fin{padding-top:30px;background:linear-gradient(to top,var(--sk-bg) calc(100% - 30px),rgba(255,255,255,0))}
.k-fin .btn.ter{min-height:38px}
.k-fin .btn.sec{min-height:48px}
.k-fin .k-legal{font-size:11.5px;line-height:16px}
.k-cuerpo>.k-fin:last-child{margin-top:auto}
.k-cuerpo>:nth-last-child(2):not(.k-fin){margin-bottom:8px}
@media (prefers-reduced-motion:reduce){#toast,#toast::before{animation:none}}

/* ───────── F2 · Germán: estilos propios del flujo ───────── */
.f2-et{display:flex;gap:8px;align-items:flex-start;padding:8px 14px 8px 10px;border-radius:14px;background:var(--sk-verde-l);border:1px solid #dff3dc;color:var(--sk-osc);font:700 13px/18px var(--tit)}
.f2-et .ic{width:18px;height:18px;flex:none}
.f2-inv{display:flex;align-items:center;gap:10px;align-self:flex-start;padding:6px 16px 6px 6px;border-radius:100px;background:var(--sk-verde-l);border:1px solid #dff3dc;font:700 13px/18px var(--tit);color:var(--sk-tinta)}
.f2-inv .ft{width:36px;height:36px;font-size:30px}
/* Recomendación profesional: sobria, tres datos visibles */
.f2-lista{display:grid;gap:8px}
.f2-lista li{position:relative;padding-left:24px;font-size:14px;line-height:20px;color:var(--sk-tinta)}
.f2-lista li::before{content:"";position:absolute;left:4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--sk-verde)}
.f2-quien{display:grid;grid-template-columns:44px 1fr;gap:1px 12px;align-items:center}
.f2-quien .ft{grid-row:1/span 2;width:44px;height:44px;font-size:36px}
.f2-quien b{font:700 15px/20px var(--tit);color:var(--sk-tinta)}
.f2-quien small{grid-column:2;font-size:13px;line-height:18px;color:var(--sk-tx2)}
.f2-perfil{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;font-size:13px;line-height:18px;color:var(--sk-tx)}
/* ¿Qué queda disponible y hasta cuándo? Dos bandas sobre el mismo eje de tiempo */
.f2-venc{display:grid;gap:6px}
.f2-venc .ba{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border-radius:10px;font:700 12.5px/16px var(--tit)}
.f2-venc .ba .ic{width:16px;height:16px;flex:none}
.f2-venc .ba b{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.f2-venc .ba.inv{background:#02842a;color:#fff}
.f2-venc .ba.vis{background:#f3fce3;color:#232323;border:1.5px dashed #6b8f1a}
.f2-venc .eje{position:relative;display:flex;justify-content:space-between;gap:10px;margin-top:4px;padding-top:8px;border-top:2px solid var(--sk-linea2);font:600 11.5px/16px var(--tit);color:var(--sk-tx2)}
.f2-venc .eje::before,.f2-venc .eje::after{content:"";position:absolute;top:-6px;width:2px;height:10px;background:var(--sk-linea2)}
.f2-venc .eje::before{left:0}
.f2-venc .eje::after{right:0}
.f2-venc .eje span:last-child{text-align:right;color:var(--sk-tinta)}
/* Composición: la barra de 4 clases lleva el porcentaje dentro cuando cabe */
.f2-comp .ap2 .f{grid-template-columns:88px 1fr}
.f2-comp .ap2-l b{white-space:nowrap}
/* Estado de la orden */
.f2-estado .tl li .k-lk{font-size:13px;min-height:28px}
.f2-estado .tl li.x b{color:var(--sk-err-tx)}

/* ───────── F3 · Índice de bienestar con piel Skandia, puerta y plan de dos metas ───────── */
.f3-tema{display:grid;gap:6px}
.f3-tema div{display:flex;gap:5px}
.f3-tema i{flex:1;height:5px;border-radius:3px;background:var(--sk-des)}
.f3-tema i.h{background:var(--sk-verde)}
.f3-tema i.a{background:linear-gradient(90deg,var(--sk-verde) var(--p,50%),var(--sk-des) var(--p,50%))}
.f3-tema p{font:700 12.5px/17px var(--tit);color:var(--sk-verde-tx)}
.f3-tema p span{font-weight:600;color:var(--sk-tx2)}
.f3-af{font:700 20px/28px var(--tit);letter-spacing:-.012em;color:var(--sk-tinta);text-wrap:pretty}
.f3-esc{display:grid;gap:8px}
.f3-esc>div{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.f3-esc button{aspect-ratio:1/1.08;border:1.5px solid var(--sk-linea2);border-radius:16px;background:var(--sk-sup);box-shadow:var(--sk-sombra);color:var(--sk-tinta);font:700 22px/1 var(--tit);transition:transform .12s var(--sale),background-color .15s,border-color .15s}
.f3-esc button:hover{border-color:var(--sk-verde)}
.f3-esc button:active{transform:scale(.93);background:var(--sk-verde-l2);border-color:var(--sk-verde)}
.f3-esc button[aria-pressed="true"]{background:var(--sk-verde-l2);border-color:var(--sk-verde)}
.f3-esc>p{display:flex;justify-content:space-between;gap:16px;font:600 12px/16px var(--tit);color:var(--sk-tx2)}
.f3-esc>p span{max-width:46%}
.f3-esc>p span:last-child{text-align:right}
.f3-na{display:grid;gap:1px;width:100%;padding:12px 16px;border:1.5px dashed var(--sk-linea2);border-radius:16px;background:none;text-align:left;color:var(--sk-tinta);font:600 14px/20px var(--tit)}
.f3-na small{font:500 12.5px/17px var(--cue);color:var(--sk-tx2)}
.f3-pil{display:grid;border-radius:16px;overflow:hidden;border:1px solid var(--sk-linea);box-shadow:var(--sk-sombra)}
.f3-pil>div{padding:16px 18px;display:grid;gap:6px}
.f3-pil .d1 p{font:700 18px/25px var(--tit);letter-spacing:-.01em;color:var(--sk-tinta);text-wrap:pretty}
.f3-pil .d1 cite{font-style:normal;font-size:11.5px;line-height:16px;color:var(--sk-tx2)}
.f3-pil .d2{background:var(--sk-gris);font-size:14px;line-height:21px;color:var(--sk-tx)}
.f3-pil .d3{background:#024725;color:#fff}
.f3-pil .d3 b{font:600 12px/16px var(--tit);color:var(--sk-lima)}
.f3-pil .d3 p{font-size:15px;line-height:22px;font-weight:600}
.f3-med{position:relative;display:grid;justify-items:center}
.f3-med svg{width:230px;height:128px;overflow:visible}
.f3-med .num{position:absolute;left:0;right:0;bottom:2px;display:grid;justify-items:center;gap:0}
.f3-med .num small{font:600 12px/16px var(--tit);color:var(--sk-tx2)}
.f3-med .num b{font:700 32px/36px var(--tit);letter-spacing:-.025em;color:var(--sk-tinta);font-variant-numeric:tabular-nums}
.f3-niv{display:grid;grid-template-columns:2fr 2fr 1fr;gap:4px;font:600 11px/15px var(--tit);color:var(--sk-tx2);text-align:center}
.f3-niv span.a{color:var(--sk-verde-tx);font-weight:700}
.e.entra .f3-med .ag{animation:ma-sube .6s .15s var(--sale) both}
.f3-ar{display:grid;gap:12px}
.f3-ar li{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:baseline;font:600 13.5px/18px var(--tit);color:var(--sk-tinta)}
.f3-ar li b{font-variant-numeric:tabular-nums}
.f3-ar li i{grid-column:1/-1;height:10px;border-radius:5px;background:var(--sk-des);overflow:hidden}
.f3-ar li i u{display:block;height:100%;border-radius:5px;background:#5a6b7b}
.f3-ar li.max i u{background:var(--sk-verde)}
.f3-ar li.min i u{background:#ffae08}
.f3-ar li em{font-style:normal;font:600 11px/16px var(--tit);padding:0 8px;border-radius:100px;margin-left:6px;background:var(--sk-verde-l);color:var(--sk-verde-tx)}
.f3-ar li.min em{background:var(--sk-warn-bg);color:var(--sk-warn-tx)}
.e.entra .f3-ar li i u{transform-origin:left center;animation:g-cre .5s var(--sale) both}
.f3-cod{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:14px;background:var(--sk-gris);font:700 20px/1 var(--mono);letter-spacing:.08em;color:var(--sk-tinta)}
.f3-lista{display:grid;gap:0;border-radius:16px;border:1px solid var(--sk-linea);background:var(--sk-sup);box-shadow:var(--sk-sombra);padding:4px 16px}
.f3-lista li{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--sk-linea);font-size:14.5px;line-height:21px;color:var(--sk-tinta)}
.f3-lista li:last-child{border-bottom:0}
.f3-lista .ic{color:var(--sk-osc);width:20px;height:20px;margin-top:1px}
.f3-bol{display:grid;gap:10px}
.f3-bol div{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:baseline;font:600 13px/18px var(--tit);color:var(--sk-tx2)}
.f3-bol b{font:700 14.5px/20px var(--tit);color:var(--sk-tinta)}
.f3-bol i{grid-column:1/-1;height:26px;border-radius:9px;background:var(--sk-verde)}
.f3-bol i.n{background:repeating-linear-gradient(135deg,#eceeea 0 6px,#f7f8f6 6px 12px);border:1.5px dashed var(--sk-linea2)}
.f3-cita{display:grid;grid-template-columns:64px 1fr;gap:2px 14px;align-items:center}
.f3-cita .ft{grid-row:1/span 2;width:64px;height:64px;font-size:54px}
.f3-cita b{font:700 16px/22px var(--tit);color:var(--sk-tinta)}
.f3-cita small{font-size:13px;line-height:18px;color:var(--sk-tx2)}
.f3-ctx{display:grid;gap:14px}
.f3-ctx .chip{min-height:38px;padding:6px 13px;font-size:13px}

/* Barra móvil y hoja de vistas */
#barra-movil{display:none}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:100px;background:var(--marca);color:var(--sobre-marca);font-size:11px;font-weight:700}
.badge[hidden]{display:none}

@media (max-width:1280px){
  .mom button span.nb{display:none}
}
@media (max-width:1023px){
  #escena{grid-template-columns:minmax(340px,430px) minmax(0,1fr)}
  #col-lado{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--sup);border:1px solid var(--linea);border-radius:16px;overflow:hidden}
  .lado-tabs{display:flex;border-bottom:1px solid var(--linea);background:var(--sup)}
  .lado-tabs button{flex:1;min-height:44px;border:0;border-bottom:3px solid transparent;background:transparent;font-weight:700;color:var(--fg2);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px}
  .lado-tabs button[aria-selected="true"]{color:var(--marca-tx);border-bottom-color:var(--marca)}
  #col-lado .panel{border:0;border-radius:0;flex:1}
  #col-lado[data-tab="asesor"] #v-mp,#col-lado[data-tab="asesor"] #v-notas,#col-lado[data-tab="mp"] #v-asesor,#col-lado[data-tab="mp"] #v-notas,#col-lado[data-tab="notas"] #v-asesor,#col-lado[data-tab="notas"] #v-mp{display:none}
  #col-lado .panel-h{border-radius:0}
  #col-lado #v-notas{display:flex}
  #notas-esc{display:none}
  .barra .mom{order:9;flex-basis:100%}
  .barra{flex-wrap:wrap}
}
@media (max-width:767px){
  .barra{gap:8px;padding-block:6px}
  .barra .mom,.barra .barra-nav,.barra-marca,#b-reiniciar span,#b-selector span{display:none}
  .barra-flujo{flex:1;font-size:13px}
  #escena{display:block;padding:0;position:relative;overflow:hidden}
  #col-persona{height:100%;gap:0;overflow:hidden}
  .tel{max-width:none;max-height:none;min-height:0;padding:0;border-radius:0;box-shadow:none;background:none;flex:1 1 0}
  .tel::before,.tel::after,.tel-isla,.tel-sb,.tel-home{display:none}
  .tel-pant{border-radius:0;--sbh:0px;--hih:8px}
  .salto,.ctl{max-width:none;border-radius:0;border-width:1px 0}
  .ctl{padding-left:var(--gl);padding-right:var(--gr)}
  
  #col-lado{position:absolute;left:0;right:0;bottom:0;height:82%;z-index:30;border-radius:20px 20px 0 0;border-width:1px 0 0;transform:translateY(102%);transition:transform .42s var(--resorte);box-shadow:0 -8px 28px -8px rgba(0,0,0,.35)}
  #col-lado.on{transform:none}
  #velo-lado{position:absolute;inset:0;z-index:29;background:var(--velo)}
  .lado-mom{flex:none}
  .lado-tabs button{font-size:13px;white-space:nowrap}
  #barra-movil{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:var(--gl);padding-right:var(--gr);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--sup);border-top:1px solid var(--linea)}
  #barra-movil .cont{flex:1}
  .sel-grid,.ley{grid-template-columns:1fr}
  .sel-in h1{font-size:24px;line-height:32px}
  #selector{padding-block:20px 28px}
  .panel-c{padding-left:var(--gl);padding-right:var(--gr)}
}
@media (min-width:768px){#velo-lado,.lado-cerrar,.lado-mom{display:none}}
@media (prefers-reduced-motion:reduce){
  #pant>.e.entra,#pant>.e.entra.atras{animation:aparece .15s linear}
  @keyframes aparece{from{opacity:0}}
  #hoja,#col-lado{transition:none}
  .nuevo{animation:none;outline:2px solid var(--marca);outline-offset:2px}
  .k-prog i,.ap2 .b i,.sw input::after,.btn,.ib,.chip,.op,.k-ib{transition:none}
  .btn:active,.ib:active,.chip:active,.op:active,.k-ib:active,.sel-t:active{transform:none}
}

/* ═════════ v2.2 (21-nov, tarde) · botones, contraste, escala viva del índice, brecha liviana ═════════ */

/* ── Botones: un principal lleno, un secundario tonal sin borde, el tercero es texto. Nunca dos del mismo peso. ── */
.btn{min-height:50px;padding:8px 20px;font-weight:600}
.btn.pri{box-shadow:none}
.tel .btn.sec:not(.chat-r .btn):not(.noti .btn),#toast .btn{background:var(--sk-tonal);border-color:transparent;color:var(--sk-tinta)}
.tel .btn.sec:not(.chat-r .btn):not(.noti .btn):hover{background:var(--sk-tonal-h)}
.tel .btn.sec[aria-pressed="true"]:not(.chat-r .btn):not(.noti .btn){background:var(--sk-verde-l2);border-color:var(--sk-verde);box-shadow:none}
.btn.ter{min-height:40px;font-size:15px}
.btn.ch{min-height:42px}
.btn.nop{animation:nop .28s var(--sale)}
@keyframes nop{25%{transform:translateX(-5px)}60%{transform:translateX(4px)}}
/* bloque fijo: dos como máximo, más bajo y con menos aire */
.k-fin{gap:6px;padding-top:20px;background:linear-gradient(to top,var(--sk-bg) calc(100% - 20px),rgba(255,255,255,0))}
.k-fin .btn.sec{min-height:46px}
.k-fin .btn.ter{min-height:36px;margin-bottom:-4px}
.k-fin .duo{gap:8px}
.k-fin .motivo[id]{display:none}
.k-fin .motivo.ver{display:flex;font-size:12.5px;line-height:17px}
.k-fin .k-legal{margin-bottom:4px;font-size:12.5px;line-height:17px}
.k-sal{display:flex;justify-content:flex-start;margin-top:-4px}
.k-lk.sal{min-height:40px;font:600 14.5px/20px var(--tit);color:var(--sk-verde-tx);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
/* hojas: el secundario a la izquierda y el principal a la derecha */
#hoja .duo .btn,.k-alert .duo .btn{min-height:48px}
.k-num.conf{margin-top:-6px}

/* ── Contraste: nada de blanco sobre el verde de marca ni sobre el degradado ── */
.k-ib.volver i,.acc3 button .oi,.app-acc .oi,.app-tabs .on,.ruta>li>h3::before,.rec-op.a .oi,.ab-env{color:var(--sk-btn-tx)}
.ab-env[aria-disabled="true"]{color:#5d6b61}
.k-card.grad .k-h2,.k-card.grad .k-h3,.app-bien b,.ruta-ban b{color:#0c1f15}
.app-bien p,.ruta-ban p{color:#0f2a17}
.ficha[aria-pressed="true"] small{color:#015c1d}
.chat-in span{color:#667781}
:root{--wa-tx2:#54656f}

/* ── Índice: escala viva. Se toca o se desliza; el número crece y el riel se llena. Sin caras ni colores de bueno y malo. ── */
.e5{display:grid;gap:10px;padding:16px 12px 14px;border-radius:24px;background:var(--sk-gris);border:1px solid var(--sk-linea)}
.e5-lee{display:flex;align-items:baseline;gap:10px;min-height:44px;padding:0 6px}
.e5-lee b{font:800 40px/44px var(--tit);letter-spacing:-.03em;color:var(--sk-tinta);font-variant-numeric:tabular-nums;min-width:26px}
.e5-lee b:empty{display:none}
.e5-lee span{font:600 14px/19px var(--tit);color:var(--sk-tx2);text-wrap:balance}
.e5-lee b.pop{animation:e5pop .32s var(--sale)}
@keyframes e5pop{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.12)}100%{transform:none;opacity:1}}
.e5-riel{position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:68px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.e5-riel::before{content:"";position:absolute;left:10%;right:10%;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--sk-des)}
.e5-lleno{position:absolute;left:10%;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--sk-verde);width:calc(max(0, var(--v) - 1) * 20%);transition:width .26s var(--sale)}
.e5-riel button{position:relative;z-index:1;justify-self:center;width:46px;height:46px;border-radius:50%;border:2px solid var(--sk-linea2);background:var(--sk-sup);color:var(--sk-tx);font:700 16px/1 var(--tit);transition:transform .26s cubic-bezier(.34,1.56,.64,1),background-color .18s,border-color .18s,box-shadow .18s,color .18s}
.e5-riel button:hover{border-color:var(--sk-verde)}
.e5-riel button.pas{border-color:var(--sk-verde);background:var(--sk-verde-l2);color:var(--sk-osc)}
.e5-riel button.on{transform:scale(1.26);border-color:var(--sk-verde);background:var(--sk-verde);color:var(--sk-btn-tx);box-shadow:0 8px 16px -8px rgba(0,120,40,.7)}
.e5-riel button.sello::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--sk-verde);animation:e5onda .44s var(--sale) forwards}
@keyframes e5onda{to{transform:scale(1.9);opacity:0}}
.e5-anc{display:flex;justify-content:space-between;gap:16px;padding:0 4px;font:600 12px/16px var(--tit);color:var(--sk-tx2)}
.e5-anc span{max-width:46%;transition:color .18s}
.e5-anc span:last-child{text-align:right}
.e5[data-v="1"] .e5-anc span:first-child,.e5[data-v="2"] .e5-anc span:first-child,.e5[data-v="4"] .e5-anc span:last-child,.e5[data-v="5"] .e5-anc span:last-child{color:var(--sk-tinta)}

/* ── Brecha y frases con cifra: sin caja lima y con barras delgadas ── */
.k-card .g-fr b,.pl-hero .g-fr b{background:none;padding:0;border-radius:0;color:var(--sk-osc)}
.brecha{gap:14px}
.brecha>div>i{height:12px;border-radius:6px}
.brecha i.t{background:#8a938c}
.brecha i.p>i{border-radius:6px 0 0 6px}
.brecha i.p>em{border-radius:0 6px 6px 0;border-width:1px;background:repeating-linear-gradient(135deg,#f3fae3 0 5px,#e4f2c2 5px 10px)}
.brecha u{display:none}
.brecha .br-f i{height:10px;border-width:1px}

@media (prefers-reduced-motion:reduce){
  .btn.nop,.e5-lee b.pop,.e5-riel button.sello::after{animation:none}
  .e5-riel button,.e5-lleno{transition:none}
}
.duo-inv>:first-child{order:2}
.duo .btn.ter{min-height:42px}
.tip-i{position:relative}
.tip-i::after{content:"";position:absolute;inset:-12px}
.tel .dato:not(.tip-app .dato):not(.chat .dato){color:#5d665f;border-color:#9aa39c}

/* ═════════ v2.3 (23-nov) · Paneles laterales como diagramas: Ecosistema Advisors y Money Pulse ═════════ */
.panel-c.mp,.panel-c.ea{flex:1;gap:16px}
.panel-h h2{display:flex;align-items:center;gap:8px}
.panel-h h2 .ic{width:18px;height:18px;color:var(--marca-tx)}

/* ── Money Pulse: el recorrido de una señal ── */
.mp-flujo{position:relative;display:grid;gap:14px}
.mp-flujo::before{content:"";position:absolute;left:17px;top:20px;bottom:20px;width:2px;background:var(--linea2)}
.mp-flujo::after{content:"";position:absolute;left:11px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--marca);box-shadow:0 0 0 5px var(--marca-suave);z-index:2;opacity:0;animation:mp-viaje 1.9s cubic-bezier(.45,0,.2,1) .15s 1 both}
@keyframes mp-viaje{0%{top:12px;opacity:0}8%{opacity:1}88%{opacity:1}100%{top:calc(100% - 30px);opacity:0}}
.mp-e{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:start}
.mp-n{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--tit);background:var(--sup);border:2px solid var(--linea2);color:var(--fg2)}
.mp-e.on .mp-n{border-color:var(--marca);color:var(--marca-tx);background:var(--marca-suave)}
.mp-c{border:1px solid var(--linea);border-radius:16px;padding:12px 14px;display:grid;gap:8px;min-width:0;background:var(--sup)}
.mp-e:nth-child(1) .mp-c{animation:mp-entra .4s ease-out .05s both}
.mp-e:nth-child(2) .mp-c{animation:mp-entra .4s ease-out .55s both}
.mp-e:nth-child(3) .mp-c{animation:mp-entra .4s ease-out 1.05s both}
@keyframes mp-entra{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.mp-h{display:flex;align-items:baseline;gap:8px}
.mp-h b{font:700 16px/22px var(--tit)}
.mp-h small{font-size:12px;color:var(--fg2)}
.mp-ecg{display:block;width:100%;height:30px}
.mp-ecg path{fill:none;stroke:var(--linea2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.mp-ecg.on path{stroke:var(--marca);stroke-dasharray:520;stroke-dashoffset:520;animation:mp-ecg 1.1s ease-out .1s forwards}
@keyframes mp-ecg{to{stroke-dashoffset:0}}
.mp-ss{display:grid;gap:10px}
.mp-s{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;align-items:start}
.mp-s>i{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--fg2)}
.mp-s.D>i,.mp-pts i.D,.mp-th i.D{background:var(--d-tx)}
.mp-s.O>i,.mp-pts i.O,.mp-th i.O{background:var(--esp-b)}
.mp-s.T>i,.mp-pts i.T,.mp-th i.T{background:var(--marca)}
.mp-s b{display:block;font:600 13.5px/19px var(--cue);color:var(--fg)}
.mp-s small{display:block;font-size:11.5px;line-height:16px;color:var(--fg2)}
.mp-s code{font-family:var(--mono);font-size:11px}
.mp-s em{display:block;font-style:normal;font-size:12px;line-height:17px;color:var(--fg2);margin-top:2px;padding-left:10px;border-left:2px solid var(--linea2)}
.mp-vacio{font-size:13px;line-height:19px;color:var(--fg2)}
.mp-lee{font:600 15px/21px var(--tit);color:var(--fg)}
.mp-oi{display:grid;grid-template-columns:82px minmax(0,1fr);gap:8px;font-size:12.5px;line-height:18px}
.mp-oi b{font-size:11px;color:var(--fg2)}
.mp-e.int .mp-c{background:var(--int-bg);border-color:var(--int-b)}
.mp-e.esp .mp-c{background:var(--esp-bg);border-color:var(--esp-b)}
.mp-e.no .mp-c{background:var(--no-bg);border-color:var(--no-b)}
.mp-dec{font:700 20px/26px var(--tit)}
.mp-e.int .mp-dec{color:var(--int-tx)} .mp-e.esp .mp-dec{color:var(--esp-tx)} .mp-e.no .mp-dec{color:var(--no-tx)}
.mp-por{font-size:13px;line-height:19px}
.mp-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fg2)}

function nuevo(f){const F=FL[f];
  S={f,id:F.inicio,est:'',v:clon(F.valores),p:{P1:{e:'sin'},P2:{e:'sin'},P3:{e:'sin'}},reg:[],paso:0,reloj:PANT[F.inicio].h||'',hoja:null,u:{},rama:F.rama,vis:[F.inicio],fin:false,salto:null,toast:null};
  HIST=[];dir=1;prevKey='';prevSig='';UI.vis={asesor:0,mp:0,notas:''};UI.gh=false;
  F.alEntrar&&F.alEntrar(S);
  try{localStorage.setItem('lobby3f.ultimo',f)}catch(e){}
}
function ir(id,e){S.id=id;S.est=e||'';S.hoja=null;const P=PANT[id];if(!S.vis.includes(id)){S.vis.push(id);if(P.h)S.reloj=P.h;}P.alLlegar&&P.alLlegar(S);}
function est(e){S.est=e||'';S.hoja=null;}
function emit(s,l,d,as){S.reg.push({k:S.paso,t:S.reloj,pa:S.id,s,l:l||'',d:d||'',as:as||null});}
function emitC(s,x){S.reg.push({k:S.paso,t:S.reloj,pa:S.id,s,c:1,l:x,as:{x,p:'com'}});}
function perm(k,e){S.p[k]={e,t:S.reloj};}
const tiene=k=>S.p[k].e==='otorgado';
const hubo=s=>S.reg.some(r=>r.s===s);
function foto(){HIST.push(JSON.stringify(S));S.paso++;S.salto=null;S.toast=null;dir=1;}
function paso(fn){foto();fn();pintar();}
function micro(fn){S.toast=null;fn();pintar();}
function anterior(){if(!S||!HIST.length)return;S=JSON.parse(HIST.pop());dir=-1;pintar();}
function volverPantalla(){if(!HIST.length){return}const k=S.id+'|'+S.est;while(HIST.length){S=JSON.parse(HIST.pop());if(S.id+'|'+S.est!==k)break;}dir=-1;pintar();}
function avanza(){ /* un paso de la ruta guiada, sin pintar; devuelve false si no hay más */
  if(!S||S.fin)return false;
  foto();
  if(S.u&&(S.u.tab==='explorar'||S.u.tab==='perfil'))S.u.tab='inicio';
  const P=PANT[S.id];let id;
  if(S.cap)id=S.cap.full?'cap-sim':S.cap.c<2?'cap-sig':'cap-seguir';
  else if(S.hoja&&!P.base)id=S.hoja.t==='txt'?'h-cerrar':'h-si'; else id=P.g(S);
  if(id==null){S=JSON.parse(HIST.pop());return false;}
  if(id!==true){construir();const a=ACC[id];
    if(!a||a.no){console.warn('Ruta guiada sin acción disponible:',S.id,S.est,id,a&&a.no);S=JSON.parse(HIST.pop());return false;}
    a.fn();}
  return true;
}
function siguiente(){if(avanza())pintar();}
function irHasta(prueba){const f=S.f;nuevo(f);let n=0;while(!prueba()&&!S.fin&&n++<200){if(!avanza())break;}pintar();}
function abrir(f,destino){nuevo(f);if(destino&&PANT[destino]&&destino!==S.id){let n=0;while(S.id!==destino&&!S.fin&&n++<200){if(!avanza())break;}if(S.id!==destino)nuevo(f);}mostrar(true);pintar();}
function alSelector(){S=null;HIST=[];mostrar(false);pintar();}

function campo(k,lab,o){o=o||{};INP[k]=o.fn;const v=S.u[k]==null?'':S.u[k];

  return `<div class="k-campo"><label for="i-${k}"${o.oculto?' class="sr"':''}>${lab}</label>${o.pre?`<div class="k-in-pre"><span>${o.pre}</span>${inp}</div>`:inp}${o.ayuda?`<span class="k-ayuda">${o.ayuda}</span>`:''}</div>`;}
function selec(k,lab,ops,fn){INP[k]=fn;return `<div class="k-campo"><label for="i-${k}">${lab}</label><select class="k-in" id="i-${k}" data-i="${k}"><option value="">Elige</option>${ops.map(x=>`<option${S.u[k]===x?' selected':''}>${x}</option>`).join('')}</select></div>`;}
/* Deslizador con campo numérico al lado: cada uno vive en su data-out para que el otro se actualice sin perder el foco */
function rango(k,o){const v=o.val==null?o.min:Math.max(o.min,Math.min(o.max,o.val)),p=Math.round((v-o.min)/(o.max-o.min)*100);
  INP[k]=x=>{o.fn(+x)};INP[k+'N']=x=>{const n=num(x);if(n!=null)o.fn(Math.max(o.min,Math.min(o.max,n)))};
  return `<div class="k-rango"><span data-out="rg-${k}"><input type="range" class="k-r" id="i-${k}" data-i="${k}" min="${o.min}" max="${o.max}" step="${o.step}" value="${v}" style="--p:${p}%" aria-label="${o.lab}"></span><span data-out="nm-${k}"><input class="k-in" id="i-${k}N" data-i="${k}N" data-fmt="pesos" type="text" inputmode="numeric" autocomplete="off" aria-label="${o.lab}, valor exacto" value="${$(v).slice(1)}"></span></div>`;}
function cod6(k,ok){A('cod-ok',ok);INP[k]=v=>{const d=String(v).replace(/\D/g,'').slice(0,6);S.u[k]=d;if(d.length===6){paso(ok);return true;}};
  const v=String(S.u[k]||'').replace(/\D/g,'').slice(0,6);
  return `<div class="cod6"><input id="i-${k}" data-i="${k}" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Código de 6 dígitos" value="${v}"><span data-out="cod-${k}">${[0,1,2,3,4,5].map(i=>`<i class="${i===Math.min(v.length,5)?'a':''}">${v[i]||''}</i>`).join('')}</span></div>`;}
/* Preguntas (P05): una por pantalla, la pregunta es el título y se avanza al tocar */
function quiz(k,qs,o){o=o||{};const r=S.u[k]||[];const i=qs.findIndex((_,j)=>r[j]==null);const hechas=qs.filter((_,j)=>r[j]!=null).length;
  const set=(j,x)=>()=>{const a=(S.u[k]||[]).slice();a[j]=x;S.u[k]=a;};
  const prog=`<div><div class="k-pasos" role="img" aria-label="${i<0?'Listo':`Pregunta ${i+1} de ${qs.length}`}">${qs.map((_,j)=>`<i class="${j<hechas?'h':''}"></i>`).join('')}</div><p class="k-c" style="margin-top:6px">${i<0?`Listo: ${qs.length} de ${qs.length}`:`${o.rot||'Pregunta'} ${i+1} de ${qs.length}${qs[i].pil?' · '+qs[i].pil:''}`}</p></div>`;
  let ops='',Q=null;
  if(i>=0){Q=qs[i];const ult=!!o.alFin&&hechas===qs.length-1,pon=(j,x)=>ult?()=>{set(j,x)();o.alFin();}:set(j,x);
    ops=`<div class="k-ops" role="group" aria-label="${esc(Q.q)}">${Q.ops.map((x,j)=>op(`${k}-${i}-${j}`,x[0],false,pon(i,j),{paso:true,sub:x[2]||''})).join('')}</div>${o.saltar?lk(`${k}-s`,'Saltar esta pregunta',pon(i,-1),{}):''}`;}
  return {i,done:i<0,r,n:qs.length,q:Q?Q.q:'',ops,prog,h:prog+ops};}
function perfilDe(qs,r){let s=0,n=0;qs.forEach((Q,j)=>{if(r[j]!=null&&r[j]>=0){s+=Q.ops[r[j]][1];n++}});const p=n?s/n:0;return p<=1.66?'conservador':p<=2.33?'moderado':'crecimiento';}

function gAcum(o){const N=Math.max(1,o.meses),b=Math.min(o.base||0,o.meta),x0=10,x1=310,y0=120,y1=26,X=m=>x0+(x1-x0)*m/N,Y=v=>y0-(y0-y1)*Math.min(v,o.meta)/o.meta;
  const pm=b<1e6&&o.meta>1e6?Math.ceil((1e6-b)/o.aporte):0,hx=X(pm),hy=Y(b+o.aporte*pm),izq=hx>190;
  return `<svg viewBox="0 0 320 148" role="img" aria-label="Lo que llevas apartado sube mes a mes hasta tu meta de ${$(o.meta)} en el mes ${N}."><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00c73d" stop-opacity=".28"/><stop offset="1" stop-color="#00c73d" stop-opacity="0"/></linearGradient></defs>
   <line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="#dfe4dd" stroke-width="1.5"/>
   <line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${x0}" y="${y1-8}" font-size="11.5" class="gt">Tu meta: ${$(o.meta)}</text>
   <path class="g-apa" d="M${x0} ${Y(b)}L${x1} ${y1}L${x1} ${y0}L${x0} ${y0}Z" fill="url(#ga)"/>
   <path class="g-dib" style="--len:340" d="M${x0} ${Y(b)}L${x1} ${y1}" fill="none" stroke="#00c73d" stroke-width="3.5" stroke-linecap="round"/>
   ${pm&&pm<N?`<g class="g-apa"><circle cx="${hx}" cy="${hy}" r="5.5" fill="#fff" stroke="#232323" stroke-width="2.5"/><text x="${hx+(izq?-10:10)}" y="${hy+16}" font-size="11.5" text-anchor="${izq?'end':'start'}" class="gt">Primer millón: mes ${pm}</text></g>`:''}
   <circle class="g-apa" cx="${x1}" cy="${y1}" r="6.5" fill="#00c73d" stroke="#fff" stroke-width="2.5"/>
   <text x="${x0}" y="140" font-size="11.5">Hoy</text><text x="${x1}" y="140" font-size="11.5" text-anchor="end">Mes ${N}</text></svg>
   <div class="g-ley"><span><i></i>Lo que llevas apartado</span><span><i class="p"></i>Tu meta</span></div>`;}

document.addEventListener('keydown',e=>{if(!S||e.altKey||e.ctrlKey||e.metaKey)return;const t=e.target;

const rutaT=(id,i,t,s,der,fn)=>`<button type="button" class="ruta-t" id="a-rt-${id}" data-a="${A('rt-'+id,fn||(()=>{}),{m:1})}"><i class="oi">${ic(i)}</i><b>${t}</b><small>${s}</small>${der||ic('flecha')}</button>`;

/* ═════════ Mini cápsulas tipo historia → cápsula completa de Skandia Channel ═════════
   Componente único: capCard(k) (tarjeta con «Ver intro») → historia de 3 cuadros → cápsula completa → simulador del flujo.
   CAPS[k]={t:título, fr:[frase1,frase2], ch:[3 capítulos], foto:'capsula-…', alt, sim:S=>…, seguir:S=>…}
   Estado: S.cap={k,c:cuadro 0..2,full,t:segundos,play}. Dentro de la historia los cuadros pasan solos (unos 5 s),
   se detiene en el tercero y nunca cambia de pantalla sola. Con prefers-reduced-motion no avanza sola. */
const CAPS={},CAP_MS=5000;
let capTimer=null,capTick=null,capIni=0,capRest=CAP_MS,capLargo=false,capHold=null;
const capAs=x=>({x,p:FL[S.f].as.nombre?'P2':'P3'});
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function capVista(n){const c=S.cap,C=CAPS[c.k];S.u.capV=Object.assign({},S.u.capV,{[c.k]:1});if(c.v)return;c.v=1;emit('capsula_intro_vista',`Cápsula «${C.t}» · ${n} de 3 cuadros`,'Ofrece la cápsula completa o seguir al plan',capAs(`Vio la intro de la cápsula «${C.t}»`));}
function capAbrir(k,full){return ()=>{S.hoja=null;S.cap={k,c:full?2:0,full:!!full,t:0,play:false,v:full?1:0};if(full)emit('capsula_completa_abierta',`Cápsula «${CAPS[k].t}» · Skandia Channel · 6 min`,'Espera: está aprendiendo',capAs(`Abrió la cápsula completa «${CAPS[k].t}»`));};}
const CAP_RESP='<svg class="cap-resp" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="390" height="844" fill="#024725"/><path d="M-30 560C80 470 170 630 270 540S410 410 440 436" fill="none" stroke="#8fe000" stroke-width="14" stroke-linecap="round"/><circle cx="300" cy="230" r="120" fill="#03592e"/></svg>';
function capPortada(C,ab){return `<span class="cap-port">${CAP_RESP}${ft('capsula-portada','','Portada de Skandia Channel')}<span class="cap-pv"></span><span class="ch">Skandia Channel</span><b>${C.t}</b><span class="lm">Tu plata, con un plan</span><i class="pl">${ic(ab)}</i><em>Cápsula · 6 min</em></span>`;}
/* Tarjeta de cápsula con «Ver intro» */
function capCard(k,o){const C=CAPS[k],visto=!!(S.u.capV&&S.u.capV[k]);A('cap-abrir-'+k,capAbrir(k));
  return `<div class="cap-card h"><button type="button" class="cap-hb" id="a-cap-abrir-${k}" data-a="cap-abrir-${k}" aria-label="Ver la historia de ${esc(C.t)}"><span class="cap-anillo${visto?' visto':''}">${ft(C.foto,'',C.alt||'')}<i class="pl">${ic('play')}</i></span><span class="cap-ht"><small>${visto?'Historia vista':'Historia'} · 3 cuadros</small><b>${C.t}</b><em>${visto?'Ver de nuevo':'Ver historia'}</em></span></button>
   <div class="cap-luego${visto?' on':''}">${ic(visto?'play':'candado')}<span>${visto?'Cápsula completa · 6 min':'Después de la historia: cápsula completa · 6 min'}</span>${visto?`<button type="button" id="a-cap-full-${k}" data-a="${A('cap-full-'+k,capAbrir(k,true))}">Ver cápsula</button>`:''}</div></div>`;}
/* Marco de historia: se reutiliza para la cápsula y para las píldoras del índice */
function capMarco(o){return `<div class="cap-st" data-sb="claro">${CAP_RESP}${ft(o.foto,'',o.alt)}<span class="cap-velo"></span>
   <div class="cap-top"><div class="cap-seg" aria-hidden="true">${Array.from({length:o.n},(_,j)=>`<i class="${j<o.i?'h':j===o.i?(o.fijo?'h':'a'):''}"></i>`).join('')}</div><div class="cap-cab"><span>${o.cab}</span><button type="button" id="a-cap-x" data-a="cap-x" aria-label="Cerrar">${ic('x')}</button></div>${LOGO}</div>${o.c}</div>`;}
function capHTML(){const c=S.cap,C=CAPS[c.k];
  if(c.full){A('cap-volver',()=>{c.full=false;c.play=false;c.c=2},{m:1});A('cap-play',()=>{c.play=!c.play;if(c.t>=360)c.t=0},{m:1});
    A('cap-sim',()=>{emit('capsula_a_simulador',`Cápsula «${C.t}» → simulador · en ${mmss(c.t)} de 6:00`,'Lleva al simulador con la meta de la cápsula',capAs(`Pasó de la cápsula «${C.t}» al simulador`));S.cap=null;C.sim(S);});
    return `<div class="k"><div class="k-bar"><button type="button" class="k-ib volver" id="a-cap-volver" data-a="cap-volver" aria-label="Volver"><i>${ic('izq')}</i></button><span></span><span></span></div><div class="k-cuerpo">
     <p class="k-rot">De Skandia Channel</p><h1 class="k-h1">${C.t}</h1>
     <button type="button" class="cap-pb" id="a-cap-play" data-a="cap-play" aria-label="${c.play?'Pausar':'Reproducir'}">${capPortada(C,c.play?'pausa':'play')}</button>
     <div class="cap-tiempo"><div class="cap-barra" role="img" aria-label="Avance de la cápsula"><i id="cap-bar" style="width:${Math.max(1.5,c.t/360*100)}%"></i></div><div class="k-kv"><span id="cap-t">${mmss(c.t)}</span><span>6:00</span></div><p class="k-c">Reproducción simulada · muestra del prototipo</p></div>
     <h2 class="k-h2">Capítulos</h2>
     <div class="cap-caps">${C.ch.map((x,i)=>`<button type="button" id="a-cap-ch${i}" data-a="${A('cap-ch'+i,()=>{c.t=i*120},{m:1})}"${c.t>=i*120&&c.t<(i+1)*120?' aria-current="true"':''}><time>${mmss(i*120)}</time>${x}</button>`).join('')}</div>
     ${fin(btn('cap-sim','Ir al simulador','pri',ACC['cap-sim'].fn))}</div></div>`;}
  A('cap-x',()=>{capVista(c.c+1);S.cap=null;});A('cap-ant',()=>{if(c.c>0)c.c--},{m:1});A('cap-sig',()=>{if(c.c<2){c.c++;if(c.c===2)capVista(3);}});
  A('cap-full',()=>{capVista(3);c.full=true;c.t=0;c.play=false;emit('capsula_completa_abierta',`Cápsula «${C.t}» · Skandia Channel · 6 min`,'Espera: está aprendiendo',capAs(`Abrió la cápsula completa «${C.t}»`));});
  A('cap-seguir',()=>{capVista(3);S.cap=null;C.seguir(S);});
  const zonas=c.c<2?`<button type="button" class="cap-z izq" data-a="cap-ant" aria-label="Cuadro anterior"${c.c?'':' disabled'}></button><button type="button" class="cap-z der" id="a-cap-sig" data-a="cap-sig" aria-label="Cuadro siguiente"></button>`:'';
  const tx=i=>`<div class="cap-tx">${C.kk?`<span class="cap-kk">${C.kk[i]}</span>`:''}<p class="cap-frase" aria-live="polite">${C.fr[i]}</p>${C.sub&&C.sub[i]?`<p class="cap-sub">${C.sub[i]}</p>`:''}</div>`;
  const cuerpo=c.c<2?(C.kk?zonas+tx(c.c):`${zonas}<p class="cap-frase" aria-live="polite">${C.fr[c.c]}</p>`)
   :C.fr[2]?`<button type="button" class="cap-z izq alto" data-a="cap-ant" aria-label="Cuadro anterior"></button><div class="cap-fin h3">${tx(2)}<button type="button" class="btn pri" id="a-cap-seguir" data-a="cap-seguir"><span>${C.btSeguir||'Seguir'}</span></button><button type="button" class="btn blanco" id="a-cap-full" data-a="cap-full"><span>Ver cápsula completa · 6 min</span></button></div>`
   :`<div class="cap-fin"><button type="button" class="cap-pb" data-a="cap-full" aria-label="Ver cápsula completa">${capPortada(C,'play')}</button><p class="cap-tt"><b>${C.t}</b><span>Cápsula · 6 min</span></p><button type="button" class="btn pri" id="a-cap-full" data-a="cap-full"><span>Ver cápsula completa</span></button><button type="button" class="btn blanco" id="a-cap-seguir" data-a="cap-seguir"><span>${C.btSeguir||'Seguir'}</span></button></div>`;
  return capMarco({foto:(C.fotos&&C.fotos[c.c])||C.foto,alt:(C.alts&&C.alts[c.c])||C.alt||'',n:3,i:c.c,fijo:c.c===2,cab:`Skandia Channel · ${C.t}`,c:cuerpo});}
/* Píldora del índice con el mismo formato de historia: un cuadro por píldora, con su texto literal */
function capPildora(o){A('cap-x',o.sig);
  return capMarco({foto:o.foto||'capsula-pension',alt:'',n:o.n,i:o.i,fijo:1,cab:o.cab,c:`<div class="cap-pil"><p class="cap-frase">${o.fact}</p><cite>Fuente: ${o.src}</cite><p>${o.why}</p><div><b>Algo que puedes hacer hoy</b><p>${o.hoy}</p></div>${btn(o.id||'pil-sig',o.bt||'Seguir','blanco',o.sig)}</div>`});}
/* Avance automático de los cuadros (solo dentro de la historia) y reproducción simulada de la cápsula completa */
function capAuto(){const c=S&&S.cap;if(!c||c.full||c.c>=2)return;paso(()=>{c.c++;if(c.c===2)capVista(3);});}
function capProg(){clearTimeout(capTimer);clearInterval(capTick);capTimer=capTick=null;const c=S&&S.cap;if(!c)return;
  if(c.full){if(c.play)capTick=setInterval(()=>{const k=S&&S.cap;if(!k||!k.full||!k.play){clearInterval(capTick);return;}k.t=Math.min(360,k.t+1);const b=q('#cap-bar'),t=q('#cap-t');if(b&&b.style)b.style.width=Math.max(1.5,k.t/360*100)+'%';if(t)t.textContent=mmss(k.t);if(k.t>=360){k.play=false;clearInterval(capTick);pintar();}},1000);return;}
  if(c.c>=2||mqR.matches)return;capIni=Date.now();capRest=CAP_MS;capTimer=setTimeout(capAuto,CAP_MS);}
document.addEventListener('pointerdown',e=>{const st=e.target&&e.target.closest&&e.target.closest('.cap-st');if(!st||!S||!S.cap||S.cap.full||S.cap.c>=2||!capTimer)return;
  clearTimeout(capTimer);capTimer=null;capRest=Math.max(300,capRest-(Date.now()-capIni));st.classList.add('pausa');capLargo=false;clearTimeout(capHold);capHold=setTimeout(()=>{capLargo=true},260);
  const suelta=()=>{document.removeEventListener('pointerup',suelta);document.removeEventListener('pointercancel',suelta);clearTimeout(capHold);st.classList.remove('pausa');if(S&&S.cap&&!S.cap.full&&S.cap.c<2&&!mqR.matches){capIni=Date.now();capTimer=setTimeout(capAuto,capRest);}};
  document.addEventListener('pointerup',suelta);document.addEventListener('pointercancel',suelta);});
document.addEventListener('click',e=>{if(capLargo){capLargo=false;if(e.target&&e.target.closest&&e.target.closest('.cap-z')){e.stopPropagation();e.preventDefault();}}},true);

/* ═════════ Tips livianos: de espera («Mientras tanto») y píldora de dato · resultado del perfil ═════════
   Dos formas y ninguna más:
   tipEspera([claves])        en un estado de espera: etiqueta «Mientras tanto», una frase de 16 palabras o menos y la fuente detrás de una «i».
   tipPildora(clave,rótulo)   bajo una gráfica o un control: píldora cerrada de una línea; abre una hoja con «dato → en tus finanzas» y la fuente.
   Un tip con la fuente sin cerrar (pv:1) no se le muestra a la persona: solo aparece con Notas activas, y en la espera entra el siguiente del banco. */
const TIPS={
 f1apr:{d:'En Colombia, 94% dice que planea sus gastos; solo 23% sabe cuánto gastó la semana pasada.',f:'Banco Mundial, Encuesta de Capacidades Financieras de Colombia, {año por verificar}',a:'Tu gasto de un mes normal es el único dato que necesitas para calcular tu colchón.',pv:1},
 f1sim:{d:'Las cesantías solo se pueden retirar para vivienda, educación o al terminar el contrato. No cubren un imprevisto.',c:'Las cesantías solo se retiran para vivienda, educación o al terminar el contrato.',f:'Código Sustantivo del Trabajo, régimen de cesantías',a:'Por eso tu colchón va en plata que puedes retirar cuando la necesites.'},
 f1act:{d:'El seguro de depósitos de Fogafín cubre cuentas y CDT. Los fondos voluntarios de pensión no están cubiertos.',c:'El seguro de depósitos de Fogafín cubre cuentas y CDT, no los fondos voluntarios de pensión.',f:'Fogafín',a:'El valor de tu fondo puede subir o bajar. Por eso tu plan dice para quién no es.'},
 f1fin:{d:'Personas que programaron subir su ahorro con cada aumento pasaron de guardar 3,5% de su sueldo a 13,6% en 40 meses.',c:'En un estudio, quienes subían su ahorro con cada aumento pasaron de guardar 3,5% de su sueldo a 13,6%.',f:'Thaler y Benartzi, 2004, Journal of Political Economy (Estados Unidos)',a:'Cuando te suban el sueldo, puedes subir tu aporte desde tu inicio.'},
 f2apr:{d:'En un fondo cerrado, tu participación solo se redime al final del plazo que fija su reglamento.',c:'En un fondo cerrado, tu participación solo se redime al final del plazo de su reglamento.',f:'Decreto 2555 de 2010, {artículo por confirmar con Legal}',a:'Mira este monto como plata que no vas a necesitar antes de {2031}.',pv:1},
 f2sim:{d:'La ficha técnica de cada fondo se actualiza cada mes y muestra en qué está invertido.',f:'SFC, Circular Básica Jurídica, {numeral por confirmar}',a:'Antes de decidir, compara la ficha de Urbano con lo que ya tienes.',pv:1},
 f2act:{d:'Una recomendación profesional debe decir en qué se basa, quién la da y si la asesoría es independiente.',c:'Una recomendación profesional debe decir en qué se basa, quién la da y si es independiente.',f:'Decreto 1239 de 2024, art. 24',a:'Esos tres datos están en esta pantalla y en la copia que te queda.'},
 f2fin:{d:'Quien administra un fondo debe rendir cuentas a sus inversionistas al menos cada seis meses.',f:'Decreto 2555 de 2010, {artículo por confirmar con Legal}',a:'El próximo informe de Urbano llega el 15 de enero. Te avisamos.',pv:1},
 f3ret:{d:'En un fondo privado, tu pensión depende de lo que ahorres durante tu vida laboral y de sus rendimientos.',c:'En un fondo privado, tu pensión depende de lo que ahorres y de sus rendimientos.',f:'Ley 100 de 1993, régimen de ahorro individual',a:'Por eso la brecha se mira temprano: a los 33 hay tiempo para moverla.'},
 f3edu:{d:'En {año}, los precios de la educación subieron {X}%.',f:'DANE, IPC por divisiones de gasto',a:'Tu cálculo va en pesos de hoy. Revísalo cada año para ajustar el aporte.',pv:1},
 f3act:{d:'En un seguro de vida, tú eliges a tus beneficiarios y puedes cambiarlos cuando quieras.',f:'Código de Comercio, art. 1146',a:'Revísalos cuando cambie tu familia: un nacimiento, una unión, una separación.'},
 f3fin:{d:'En 2025, el 53,9% de los retiros de cesantías en Colombia fue para vivienda.',f:'Asofondos',a:'Tu ahorro ya tiene destino y nombre: la educación de tu hijo.'}
};
const tipOk=k=>!!TIPS[k]&&(!TIPS[k].pv||UI.notas);
const tipPar=k=>{const T=TIPS[k];return `<p class="k-p">${T.d}</p><div class="tip-app2"><b>En tus finanzas</b><p>${T.a}</p></div><p class="k-c">Fuente: ${T.f}</p>`;};
function tipEspera(ks){const k=[].concat(ks||[]).find(tipOk);if(!k)return'';const T=TIPS[k],ab=S.u.tipI===k;A('tip-i',()=>{S.u.tipI=ab?null:k},{m:1});
  return `<div class="tip-e"><b>Mientras tanto</b><p>${T.c||T.d} <button type="button" class="tip-i" id="a-tip-i" data-a="tip-i" aria-expanded="${ab}" aria-label="Ver la fuente de este dato">i</button></p>${ab?`<small>Fuente: ${T.f}.${T.a?' En tus finanzas: '+T.a:''}</small>`:''}</div>`;}
function tipPildora(k,rot){if(!tipOk(k))return'';A('tip-p',()=>{emit('detalle_revisado',`Dato abierto: «${rot}»`,'Suma al hilo educativo; no dispara contacto');hTxt({et:'Dato',ti:rot,tx:tipPar(k),bt:'Cerrar'});},{m:1});
  return `<button type="button" class="tip-p" id="a-tip-p" data-a="tip-p">${ic('bombilla')}<span>${rot}</span></button>`;}

/* Resultado del perfil: el perfil se entiende viendo un camino. Foto, línea curva lima que se dibuja, escala de tres posiciones y tres rasgos. */
const PF={conservador:{n:'Conservador',foto:'perfil-conservador',alt:'Un kayak avanza por un lago en calma',x:0,vr:'baja',pl:'corto',d:'M16 112C84 108 160 102 304 92',y:92},
 moderado:{n:'Moderado',foto:'perfil-moderado',alt:'Un sendero ondulado sube entre colinas verdes',x:1,vr:'media',pl:'mediano',d:'M16 128C46 108 66 134 100 114S150 116 186 92S240 96 304 62',y:62},
 crecimiento:{n:'Crecimiento',foto:'perfil-arriesgado',alt:'La cresta empinada de una montaña',x:2,vr:'alta',pl:'largo',d:'M16 140C40 86 62 146 96 98S138 124 172 68S222 98 304 30',y:30}};
function perfilRes(pf,o){const P=PF[pf];
  return lobby(`<div class="pf-foto">${ft(P.foto,'',P.alt)}<span class="pf-velo"></span><svg viewBox="0 0 320 220" preserveAspectRatio="none" aria-hidden="true"><path class="pf-l" pathLength="100" d="${P.d}"/></svg><i class="pf-pt" style="left:95%;top:${(P.y/220*100).toFixed(1)}%"></i><span class="pf-tx"><small>Tu perfil</small><b>${P.n}</b></span></div>
   <div class="pf-esc" style="--x:${P.x}" role="img" aria-label="Tu perfil es ${P.n}, en una escala de tres: conservador, moderado y crecimiento"><i></i>${['Conservador','Moderado','Crecimiento'].map((t,j)=>`<span class="${j===P.x?'a':''}">${t}</span>`).join('')}</div>
   <p class="k-p">${PERFIL_TX[pf]}</p>
   <ul class="pf-ras"><li style="--i:0"><i>${ic('ondas')}</i><span>Variación<b>${P.vr}</b></span></li><li style="--i:1"><i>${ic('cal')}</i><span>Plazo<b>${P.pl}</b></span></li><li style="--i:2" class="an"><i>${ic('filtro')}</i><span>Verás solo opciones acordes contigo</span></li></ul>
   ${o.pie?`<p class="k-c">${o.pie}</p>`:''}
   ${fin(btn('ver',o.bt||'Seguir','pri',o.alSeguir)+btn('reset','Cambiar mis respuestas','ter',o.alCambiar,{m:1}))}`,o.lob);}
/* Preguntas del perfil → espera «Armando tu perfil» (con su tip) → resultado */
function perfilPant(S,o){const z=quiz(o.k,o.qs,{alFin:()=>est('arma')});
  if(S.est==='arma'){A('pf-listo',()=>est('perfil'));return lobby(`<div class="espera" role="status">${marcaAnim('gr esp')}<h1 class="k-h2">Armando tu perfil</h1><p class="k-ap">Toma unos segundos.</p>${tipEspera(o.tips)}</div>`,o.lob);}

function saldoPulso(o){
  if(o.nuevo)return `<p class="sal-t neutro">${ic('check')}<span>${o.nuevo}</span></p>`;

function saldoLinea(pts){const n=pts.length,mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),X=i=>4+i*(76/(n-1)),Y=v=>28-(v-mn)/((mx-mn)||1)*22;
  return `<svg class="sal-sp" viewBox="0 0 84 34" role="img" aria-label="Tu saldo en los últimos ${n} meses"><path d="M${pts.map((v,i)=>X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('L')}"/><circle cx="${X(n-1).toFixed(1)}" cy="${Y(pts[n-1]).toFixed(1)}" r="3.4"/></svg>`;}

  return {hoy:Math.round(1200e6/F2META*100),sin:Math.round(f(P0)/F2META*100),con:Math.round(f(d)/F2META*100)};}

function histoSerie(h){const n=h.anos*12,rm=Math.pow(1+h.r,1/12)-1,p=[1];for(let i=1;i<=n;i++)p.push(p[i-1]*(1+rm*(1+.9*Math.sin(i*1.7)+.5*Math.sin(i*.6+1))));const k=Math.pow(1+h.r,h.anos)/p[n];return p.map((v,i)=>v*(1+(k-1)*i/n));}
function histo(k){const h=RHIST[k],s=histoSerie(h),n=s.length-1,mx=s[n],X=i=>6+i*288/n,Y=v=>78-(v-1)/(mx-1)*58,fin=$(Math.round(1e6*mx/1e3)*1e3);
  const L=s.map((v,i)=>X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('L');
  return `<div class="hist"><div class="hist-c"><p class="hist-r">${ic('tendencia')}Rentabilidad histórica</p><p class="hist-n"><b>${h.t}%</b><span>efectivo anual · ${h.per}</span></p></div>
   <svg class="hist-g" viewBox="0 0 300 88" role="img" aria-label="Un millón de pesos puesto en este portafolio en ${h.ini} sería ${fin} en ${h.fin}"><path class="ar" d="M${L}L294 86L6 86Z"/><path class="ln" pathLength="1" d="M${L}"/><circle cx="${X(n).toFixed(1)}" cy="${Y(mx).toFixed(1)}" r="4.5"/></svg>
   <div class="hist-e"><span>$1.000.000<small>${h.ini}</small></span><span class="f"><b>${fin}</b><small>${h.fin}</small></span></div>
   <p class="hist-a">Así creció $1.000.000 en este portafolio. No garantiza resultados futuros.</p>${como(`Tomamos la rentabilidad del portafolio, ya descontada su comisión, con corte al ${RHIST_CORTE}${h.fu?' (fuente: '+h.fu+')':''}. La gráfica muestra cuánto valdría $1.000.000 puesto en ${h.ini}, sin aportes ni retiros.`)}</div>`;}
function histoLin(k){const h=RHIST[k];
  return `<p class="hist-l">${ic('tendencia')}<span>Rentabilidad histórica: <b>${h.t}% efectivo anual</b>, ${h.per}${h.fu?' ('+h.fu+')':''}. No garantiza resultados futuros.</span></p>`;}
