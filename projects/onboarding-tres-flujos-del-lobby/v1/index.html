/* ═════════ v2.8 (23-nov, noche) · Money Pulse: cada señal suma a la disposición a decidir ═════════
   Base: el score del proyecto Motor de Score (actas del 1-sep y del 16-sep-2026) y Money Pulse (señal → contexto → acción).
   · Mide UNA cosa: qué tan dispuesta está la persona a tomar una decisión financiera en los próximos 3 meses. De 0 a 100.
   · Tres categorías: comprensión, intención e historial. Suma fuerte lo que hace por iniciativa propia; suma poco lo que pone el empleador.
   · No suman el saldo ni lo que se hace por obligación legal (identidad, autorizaciones, firmas). Las respuestas de salud no entran.
   · La intención se vence y quejarse no resta: una señal de riesgo cambia el carril, no el puntaje.
   · Se interpreta en carriles: escucha y acompañamiento (educación), preparación para decidir (activación), evolución y retención.
   Los puntos por señal y los cortes de cada carril son de ejemplo: los define el equipo de datos. Cada señal suma una sola vez. */
const SC_CAT={C:'Comprensión',I:'Intención',H:'Historial'};
const SC={
 capsula_intro_vista:['C',1],capsula_vista:['C',2],capsula_completa_abierta:['C',2],capsula_a_simulador:['C',2],documento_descargado:['C',1],simulacion_completada:['C',4],detalle_revisado:['C',2],
 meta_elegida:['C',6],perfil_respuesta:['C',5],dato_declarado:['C',3],monto_elegido:['C',3],indice_respondido:['C',5],indice_remedido:['C',3],evento_vida_declarado:['C',5],freno_declarado:['C',3],
 frente_abierto:['C',2],saldo_consultado:['C',2],detalle_producto_visto:['C',2],
 puerta_abierta:['I',2],lobby_visto:['I',1],cuenta_creada:['I',4],item_sumado:['I',4],activar_tap:['I',18],hablar_con_asesor:['I',8],cita_agendada:['I',6],permiso_contacto_respondido:['I',4],permiso_avance_respondido:['I',2],
 recomendacion_respondida:['I',6],sesion_retomada:['I',4],aporte_recurrente_elegido:['I',6],debito_programado:['I',4],beneficiarios_designados:['I',3],segundo_frente_iniciado:['I',6],
 contrato_creado:['H',6],orden_registrada:['H',6],primer_aporte_recaudado:['H',8],aporte_recaudado:['H',4],descuento_nomina_activo:['H',4],aporte_nomina_recaudado:['H',2],hito_seis_meses:['H',6],traslado_solicitado:['H',3],traslado_confirmado:['H',3]};
const SC_BASE={F2:{C:8,H:24}};
const SC_GEN={F1:'a',F2:'o',F3:'a'};
function scCalc(S){const per=S.reg.filter(r=>!r.c),vis={},b=SC_BASE[S.f]||{},cat={C:b.C||0,I:b.I||0,H:b.H||0};let hoy=0,ab=-1,cierra=-1;
  const filas=per.map((r,i)=>{const p=SC[r.s],nuevo=!!p&&!vis[r.s];if(p)vis[r.s]=1;const n=nuevo?p[1]:0;if(n){cat[p[0]]+=n;if(r.k===S.paso)hoy+=n;}
    if(r.s==='paso_abandonado')ab=i;if(/^(primer_aporte_recaudado|aporte_recaudado|sesion_retomada)$/.test(r.s))cierra=i;return {r,c:p?p[0]:null,n,rep:!!p&&!nuevo};});
  const tot=Math.min(100,cat.C+cat.I+cat.H),g=SC_GEN[S.f]||'a',riesgo=ab>cierra;
  const B=riesgo?{k:'ret',t:'En retención',p:'Hay una señal de riesgo abierta. Primero se atiende eso y no se ofrece nada nuevo. El puntaje no baja por esto.',ca:'Carril: retención'}
   :tot>=70?{k:'evo',t:'En evolución',p:'Ya decidió. Lo que sigue es cuidar la relación y abrirle el siguiente frente.',ca:'Carril: mantenimiento y evolución'}
   :tot>=45?{k:'lis',t:`Preparad${g} para decidir`,p:'Levantó la mano. El siguiente paso es facilitarle la decisión, sin esperar más contenido.',ca:'Carril: activación'}
   :tot>=20?{k:'aco',t:'En acompañamiento',p:'Está entendiendo. Se le acompaña a su ritmo, con educación y sin llamada de venta.',ca:'Carril: educación'}
   :{k:'esc',t:'En escucha',p:'Todavía hay pocas señales. Un puntaje bajo es una alerta para Skandia, no un veredicto sobre la persona.',ca:'Carril: educación'};
  return {filas,cat,tot,hoy,B,base:(b.C||0)+(b.H||0)+(b.I||0)};}
const scChip=f=>f.n?`<span class="sc-p ${f.c}">+${f.n} · ${SC_CAT[f.c]}</span>`:`<span class="sc-p cero">${f.rep?'Ya sumó':'No suma'}</span>`;
function scHTML(z){const B=z.B;UI.sc=UI.sc||{};const m=UI.sc;if(m.f!==S.f){m.f=S.f;m.paso=S.paso;m.prev=z.base;m.tot=z.tot;}else if(m.paso!==S.paso){m.prev=Math.min(m.tot,z.tot);m.paso=S.paso;m.tot=z.tot;}else m.tot=z.tot;
  const mx=Math.max(20,z.cat.C,z.cat.I,z.cat.H);

   <div class="mp-sc-e" aria-hidden="true"><span>Escucha</span><span>Acompañamiento</span><span>Decisión</span><span>Evolución</span></div>
   <p class="mp-sc-p">${B.p} <b>${B.ca}.</b></p>
   <details class="plg"><summary>Ver de dónde sale el puntaje</summary>
    <ul class="mp-sc-c">${['C','I','H'].map(k=>`<li><span>${SC_CAT[k]}</span><i><u class="${k}" style="width:${Math.round(z.cat[k]/mx*100)}%"></u></i><b>${z.cat[k]}</b></li>`).join('')}</ul>
    <ul class="mp-sc-r"><li>Suma fuerte lo que la persona hace por iniciativa propia: activar, pedir ayuda, aportar de su bolsillo o declarar una meta.</li><li>Suma poco lo que pone el empleador.</li><li>No suman el saldo ni lo que se hace por obligación legal. Las respuestas de salud no entran.</li><li>La intención se vence: sin actividad, el puntaje baja. Quejarse no resta.</li>${z.base?'<li>Arranca con puntos: ya era cliente y trae historial propio.</li>':''}<li>Puntos y cortes de ejemplo: los define el equipo de datos.</li></ul></details></section>`;}

  const tira=`<div class="mp-tira"><div class="mp-th"><b>${per.length?pl(per.length,'señal','señales')+' en este flujo':'Aún no hay señales'}</b><span>${['D','O','T'].map(t=>`<span><i class="${t}"></i>${TIPO[t]} ${cu[t]}</span>`).join('')}</span></div>
    ${per.length?`<div class="mp-pts" role="img" aria-label="${per.length} señales: ${cu.D} declaradas, ${cu.O} observadas y ${cu.T} transaccionales">${per.map(r=>`<i class="${SENALES[r.s][0]}${r.k===S.paso?' n':''}" title="${esc(String(r.l||r.s).replace(/[{}]/g,''))}"></i>`).join('')}</div>
