  <script>
    customElements.whenDefined('sk-button').then(() => {
      const ui = document.importNode(document.getElementById('ui').content, true);
      const $ = (s) => ui.querySelector(s);

      // Botones que navegan a otra pantalla
      ui.querySelectorAll('sk-button[data-href]').forEach((b) => b.addEventListener('skClick', () => (location.href = b.dataset.href)));

      // Carrusel de actualidad: avanza una foto por clic. Sin autoplay.
      const carrusel = $('.carrusel');
      const paso = () => carrusel.querySelector('li').getBoundingClientRect().width + 24;
      $('#foto-anterior').addEventListener('skClick', () => carrusel.scrollBy({ left: -paso() }));
      $('#foto-siguiente').addEventListener('skClick', () => carrusel.scrollBy({ left: paso() }));

      document.getElementById('app').append(ui);

      // Sticker: una sola vuelta cuando entra en pantalla (la CSS la apaga con movimiento reducido)
      const sticker = document.querySelector('.sticker');
      new IntersectionObserver((entradas, obs) => {
        if (entradas[0].isIntersecting) { sticker.classList.add('gira'); obs.disconnect(); }
      }, { threshold: 0.6 }).observe(sticker);

      // La UI se monta después de cargar: se respeta el ancla (index.html#asi-somos) al llegar desde otras pantallas
      if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    });
  </script>
