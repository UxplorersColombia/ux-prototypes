<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script id="tailwind-config">
    // Un color de Tailwind que apunta a un token y admite modificadores de opacidad (bg-skandia-border/60)
    const tk = (token) => ({ opacityValue }) =>
      opacityValue === undefined ? `var(${token})` : `color-mix(in srgb, var(${token}) calc(${opacityValue} * 100%), transparent)`;
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            white: tk('--sk-color-surface'),
            black: tk('--background-black'),
            skandia: {
              green: tk('--sk-color-primary'),
              vibrant: tk('--sk-color-accent'),
              lime: tk('--marca-lima'),
              active: tk('--sk-color-primary-active'),
              soft: tk('--sk-color-secondary-hover-bg'),
              light: tk('--sk-color-tertiary-hover-bg'),
              mint: tk('--texts-complementary'),
              paper: tk('--background-secundaria'),
              surface: tk('--sk-color-surface'),
              ink: tk('--sk-color-text'),
              gray: tk('--sk-color-text-muted'),
              border: tk('--sk-color-border'),
              dark: tk('--background-black'),
              washi: tk('--background-warning-light'),
              warning: tk('--sk-color-warning')
            }
          },
          borderRadius: { DEFAULT: '0.5rem', lg: '1rem', xl: '1.5rem', full: '9999px' },
          boxShadow: {
            sm: 'var(--sk-shadow-subtle)', DEFAULT: 'var(--sk-shadow-surface)', md: 'var(--sk-shadow-surface)',
            lg: 'var(--sk-shadow-raised)', xl: 'var(--sk-shadow-overlay)'
          },
          fontFamily: {
            headline: ['var(--sk-font-title)'], display: ['var(--sk-font-title)'],
            body: ['var(--sk-font-body)'], label: ['var(--sk-font-title)']
          }
        }
      }
    }
  </script>
