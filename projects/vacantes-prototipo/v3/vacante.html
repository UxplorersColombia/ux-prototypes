<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asesor Pensional — Vacantes Skandia</title>

  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="https://skcoblobresources.blob.core.windows.net/digital-assets/icons/typography-blob/v1/sk-fonts.css">
  <link rel="stylesheet" href="https://skcoblobresources.blob.core.windows.net/digital-assets/icons/typography-blob/v1/sk-typography.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7/primeicons.css">
  <script src="https://skcostgblobresources.blob.core.windows.net/skco-lib-components/sk-components-elements.js"></script>
  <link rel="stylesheet" href="sk-base.css">
  <link rel="stylesheet" href="editorial.css">
</head>
<body>
  <div id="app"></div>

  <template id="ui">
    <header class="cabecera">
      <div class="contenedor">
        <a href="index.html" aria-label="Skandia, ir al inicio"><sk-logo sk-style="negro" decorativo style="height: 32px"></sk-logo></a>
        <nav aria-label="Principal">
          <a class="nav-link" href="index.html#beneficios">Beneficios</a>
          <a class="nav-link" href="index.html#equipos">Equipos</a>
          <a class="nav-link" href="index.html#como-aplicar">Cómo aplicar</a>
          <a class="nav-pill" href="vacantes.html">Vacantes</a>
        </nav>
      </div>
    </header>
    <div class="esquina-cruzada" aria-hidden="true"></div>

    <main class="contenedor pagina">
      <section class="titulo">
        <sk-breadcrumb id="migas"></sk-breadcrumb>
        <div class="etiquetas">
          <sk-badge type="square" state="success" style="fill">Ventas</sk-badge>
          <sk-badge type="square" state="success" style="stroke">Bogotá</sk-badge>
          <sk-badge type="square" state="success" style="fill">Híbrido</sk-badge>
          <sk-badge type="square" state="success" style="stroke">Término indefinido</sk-badge>
          <sk-badge type="square" state="success" style="stroke">Semi Senior</sk-badge>
          <sk-badge type="square" state="success" style="stroke">Visita a clientes</sk-badge>
        </div>
        <h1><span class="ligero">Asesor</span> <span class="marcador">Pensional</span></h1>
      </section>

      <div class="sk-grid ficha">
        <article class="papel ficha-cuerpo" data-col="8">
          <section>
            <h2><span class="subrayado">Tu misión</span></h2>
            <p>Acompañar a nuestros clientes en la construcción de su futuro pensional, ayudándoles a alcanzar sus metas financieras de largo plazo.</p>
          </section>
          <hr class="divisor">
          <section>
            <h2><span class="ligero">¿Qué retos</span> <span class="subrayado">te ofrecemos</span>?</h2>
            <ul class="lista-puntos">
              <li>Asesorar a clientes actuales y potenciales sobre productos de pensión voluntaria y obligatoria.</li>
              <li>Gestionar la cartera de clientes asignada y cumplir metas comerciales mensuales.</li>
              <li>Realizar seguimiento a las solicitudes de traslado y afiliación.</li>
              <li>Mantener actualizada la información de clientes en el CRM.</li>
            </ul>
          </section>
          <hr class="divisor">
          <section>
            <h2><span class="ligero">¿Qué esperamos</span> <span class="subrayado">de ti</span>?</h2>
            <ul class="lista-puntos">
              <li>Profesional o técnico en carreras administrativas, económicas o afines.</li>
              <li>1 año de experiencia en asesoría comercial o financiera.</li>
              <li>Certificación AMV vigente (deseable).</li>
            </ul>
          </section>
          <hr class="divisor">
          <section>
            <h2><span class="ligero">¿Qué tenemos</span> <span class="subrayado">para ti</span>?</h2>
            <ul class="lista-puntos">
              <li>Comisiones sin techo sobre cumplimiento de metas.</li>
              <li>Auxilio de movilidad.</li>
              <li>Plan de carrera dentro de la Vicepresidencia de Ventas.</li>
            </ul>
          </section>
        </article>

        <aside class="aviso-aplicar" data-col="4" aria-label="Aplicar a la vacante">
          <h3><span class="ligero">¿Listo para</span> <b>aplicar</b>?</h3>
          <p>No necesitas crear una cuenta. Solo te tomará un par de minutos.</p>
          <svg class="flecha" viewBox="0 0 40 32" aria-hidden="true"><path d="M4,6 C16,4 30,8 34,24"></path><path d="M26,19 C30,21 33,23 34,25 C36,22 38,19 38,15"></path></svg>
          <sk-button id="aplicar" label="Aplicar a esta vacante"></sk-button>
          <sk-button id="volver" label="Volver al listado" sk-type="tertiary"></sk-button>
        </aside>
      </div>
    </main>

    <footer class="pie">
      <div class="contenedor">
        <div class="pie-marca"><sk-logo sk-style="blanco" decorativo style="height: 32px"></sk-logo></div>
        <small>Skandia Colombia</small>
      </div>
    </footer>
  </template>

  <script>
    customElements.whenDefined('sk-button').then(() => {
      const ui = document.importNode(document.getElementById('ui').content, true);
      const $ = (s) => ui.querySelector(s);

      $('#migas').items = [{ label: 'Inicio', href: 'index.html' }, { label: 'Vacantes', href: 'vacantes.html' }, { label: 'Asesor Pensional' }];
      $('#aplicar').addEventListener('skClick', () => (location.href = 'aplicar.html'));
      $('#volver').addEventListener('skClick', () => (location.href = 'vacantes.html'));

      document.getElementById('app').append(ui);
    });
  </script>
</body>
</html>
