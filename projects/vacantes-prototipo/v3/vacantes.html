<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vacantes — Skandia Colombia</title>

  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="https://skcoblobresources.blob.core.windows.net/digital-assets/icons/typography-blob/v1/sk-fonts.css">
  <link rel="stylesheet" href="https://skcoblobresources.blob.core.windows.net/digital-assets/icons/typography-blob/v1/sk-typography.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeicons@7/primeicons.css">
  <script src="https://skcostgblobresources.blob.core.windows.net/skco-lib-components/sk-components-elements.js"></script>
  <link rel="stylesheet" href="sk-base.css">
  <link rel="stylesheet" href="editorial.css">
  <script src="filtros.js"></script>
</head>
<body>
  <div id="app"></div>

  <template id="ui">
    <header class="cabecera">
      <div class="contenedor">
        <a href="index.html" aria-label="Skandia, ir al inicio"><sk-logo sk-style="negro" decorativo style="height: 32px"></sk-logo></a>
        <nav aria-label="Principal">
          <a class="nav-link" href="index.html#beneficios">Beneficios</a>
          <a class="nav-link" href="index.html#equipos">Equipos</a>
          <a class="nav-link" href="index.html#como-aplicar">Cómo aplicar</a>
          <a class="nav-pill" href="vacantes.html">Vacantes</a>
        </nav>
      </div>
    </header>
    <div class="esquina-cruzada" aria-hidden="true"></div>

    <div class="filtros-fija">
      <div class="contenedor">
        <div class="papel barra-filtros" role="search" aria-label="Filtrar vacantes">
          <sk-input-text id="f-buscar" size="sm" label="Buscar por cargo" placeholder="Ej. asesor, backend..." icon-left="pi pi-search" clearable></sk-input-text>
          <sk-input-select id="f-equipo" variant="check" label="Vicepresidencia / equipo"></sk-input-select>
          <sk-input-select id="f-modalidad" variant="check" label="Modalidad"></sk-input-select>
          <sk-input-select id="f-contrato" variant="check" label="Tipo de contrato"></sk-input-select>
          <sk-input-select id="f-nivel" variant="check" label="Nivel de experiencia"></sk-input-select>
          <sk-button id="f-limpiar" label="Limpiar" sk-type="tertiary" data-ancho="auto"></sk-button>
        </div>
      </div>
    </div>

    <main class="contenedor pagina">
      <section class="titulo">
        <sk-breadcrumb id="migas"></sk-breadcrumb>
        <h1>
          <span class="ligero">Buscamos al</span><br>
          <span class="ovalo">
            <svg viewBox="0 0 320 100" preserveAspectRatio="none" aria-hidden="true">
              <path class="trazo-1" d="M25,50 C20,18 95,8 200,8 C290,8 312,24 308,55 C304,82 230,94 125,93 C40,92 12,74 18,44 C20,32 40,24 65,18"></path>
              <path class="trazo-2" d="M210,12 C285,15 305,28 300,56 C295,80 235,90 140,89"></path>
            </svg>
            mejor talento
          </span>
        </h1>
        <p>Conoce las oportunidades que tenemos para ti en todo el país y construye tu carrera con nosotros.</p>
      </section>

      <section class="stack" aria-label="Resultados">
        <small class="contador" role="status">4 vacantes encontradas</small>

        <div class="grupo">
          <h2><span class="subrayado">Ventas</span></h2>
          <div class="sk-grid">
            <article class="papel carpeta" data-col="6">
              <div class="etiquetas">
                <sk-badge type="square" state="success" style="fill">Híbrido</sk-badge>
                <sk-badge type="square" state="success" style="stroke">Término indefinido</sk-badge>
                <sk-badge type="square" state="success" style="stroke">Visita a clientes</sk-badge>
              </div>
              <h3>Asesor Pensional</h3>
              <p>Acompañar a nuestros clientes en la construcción de su futuro pensional, ayudándoles a alcanzar sus metas financieras de largo plazo.</p>
              <div class="accion"><sk-button label="Ver vacante" sk-type="tertiary" icon="pi pi-arrow-right" icon-pos="right" data-ancho="auto" data-href="vacante.html"></sk-button></div>
            </article>
            <article class="papel carpeta" data-col="6">
              <div class="etiquetas">
                <sk-badge type="square" state="success" style="fill">Híbrido</sk-badge>
                <sk-badge type="square" state="success" style="stroke">Término indefinido</sk-badge>
                <sk-badge type="square" state="success" style="stroke">Visita a clientes</sk-badge>
              </div>
              <h3>Financial Planner</h3>
              <p>Enseñar a las personas a construir metas financieras de corto, mediano y largo plazo, diseñando planes personalizados de inversión y protección.</p>
              <div class="accion"><sk-button label="Ver vacante" sk-type="tertiary" icon="pi pi-arrow-right" icon-pos="right" data-ancho="auto" data-href="vacante.html"></sk-button></div>
            </article>
          </div>
        </div>

        <div class="grupo">
          <h2><span class="subrayado">Tecnología</span></h2>
          <div class="sk-grid">
            <article class="papel carpeta" data-col="6">
              <div class="etiquetas">
                <sk-badge type="square" state="success" style="fill">Híbrido</sk-badge>
                <sk-badge type="square" state="success" style="stroke">Término indefinido</sk-badge>
              </div>
              <h3>Desarrollador/a Backend</h3>
              <p>Construir y mantener los servicios que soportan los productos digitales de Skandia, con foco en calidad y seguridad de la información.</p>
              <div class="accion"><sk-button label="Ver vacante" sk-type="tertiary" icon="pi pi-arrow-right" icon-pos="right" data-ancho="auto" data-href="vacante.html"></sk-button></div>
            </article>
          </div>
        </div>

        <div class="grupo">
          <h2><span class="subrayado">Talento Humano</span></h2>
          <div class="sk-grid">
            <article class="papel carpeta" data-col="6">
              <div class="etiquetas">
                <sk-badge type="square" state="success" style="fill">Híbrido</sk-badge>
                <sk-badge type="square" state="success" style="stroke">Término indefinido</sk-badge>
              </div>
              <h3>Especialista de Selección</h3>
              <p>Liderar los procesos de atracción y selección de talento, garantizando una experiencia de candidato ágil y de calidad.</p>
              <div class="accion"><sk-button label="Ver vacante" sk-type="tertiary" icon="pi pi-arrow-right" icon-pos="right" data-ancho="auto" data-href="vacante.html"></sk-button></div>
            </article>
          </div>
        </div>
      </section>
    </main>

    <footer class="pie">
      <div class="contenedor">
        <div class="pie-marca"><sk-logo sk-style="blanco" decorativo style="height: 32px"></sk-logo><small>Skandia Colombia</small></div>
        <small>© 2025 Skandia Colombia. Todos los derechos reservados.</small>
      </div>
    </footer>
  </template>

  <script>
    customElements.whenDefined('sk-button').then(() => {
      const ui = document.importNode(document.getElementById('ui').content, true);

      ui.querySelector('#migas').items = [{ label: 'Inicio', href: 'index.html' }, { label: 'Vacantes' }];
      iniciarFiltros(ui);
      ui.querySelectorAll('sk-button[data-href]').forEach((b) => b.addEventListener('skClick', () => (location.href = b.dataset.href)));

      document.getElementById('app').append(ui);
    });
  </script>
</body>
</html>
