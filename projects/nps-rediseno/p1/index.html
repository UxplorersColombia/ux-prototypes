<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPS y CES — Prototipo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;700&display=swap');

  :root{
    --primary-00:#00c73d; --primary-d01:#03a835;
    --bar:#141514; --bar-line:#2b2e2b; --bar-ink:#cfd6cf;
    --title:'Montserrat'; --body:'Open Sans';
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:var(--body), system-ui, sans-serif;
    background:#e9e9e9;
    display:flex; flex-direction:column;
  }

  .topbar{
    flex-shrink:0; height:48px; background:var(--bar); border-bottom:1px solid var(--bar-line);
    display:flex; align-items:center; justify-content:space-between; padding:0 14px; gap:16px;
  }
  .switcher{ display:flex; gap:4px; background:rgba(255,255,255,.07); padding:4px; border-radius:8px; }
  .switcher button{
    font-family:var(--body); font-weight:700; font-size:12px; color:var(--bar-ink);
    background:transparent; border:none; border-radius:6px; padding:7px 16px; cursor:pointer;
    display:flex; align-items:center; gap:7px;
  }
  .switcher button:hover{ color:#fff; }
  .switcher button.active{ background:var(--primary-00); color:#fff; }
  .switcher svg{ width:13px; height:13px; display:block; }

  .context{
    font-family:var(--title); font-weight:700; font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; color:#7d837d; white-space:nowrap;
  }
  @media (max-width:620px){ .context{ display:none; } }

  .viewport{ flex:1; min-height:0; position:relative; background:#e9e9e9; }
  .viewport iframe{ position:absolute; inset:0; width:100%; height:100%; border:none; display:block; }
  .viewport iframe[hidden]{ display:none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="switcher" role="tablist" aria-label="Cambiar entre versiones">
    <button id="tabDesktop" class="active" type="button" role="tab" aria-selected="true" aria-controls="frameDesktop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      Desktop · Portal
    </button>
    <button id="tabMobile" type="button" role="tab" aria-selected="false" aria-controls="frameMobile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
      Mobile · App
    </button>
  </div>
  <span class="context" id="contextLabel">Modal de Qualtrics sobre el Portal</span>
</div>

<div class="viewport">
  <iframe id="frameDesktop" src="portal.html" title="Prototipo del Portal (desktop)"></iframe>
  <iframe id="frameMobile" src="app.html" title="Prototipo de la App (mobile)" hidden></iframe>
</div>

<script>
  var tabDesktop = document.getElementById('tabDesktop');
  var tabMobile  = document.getElementById('tabMobile');
  var frameDesktop = document.getElementById('frameDesktop');
  var frameMobile  = document.getElementById('frameMobile');
  var contextLabel = document.getElementById('contextLabel');

  function show(which){
    var isDesktop = which === 'desktop';
    tabDesktop.classList.toggle('active', isDesktop);
    tabMobile.classList.toggle('active', !isDesktop);
    tabDesktop.setAttribute('aria-selected', String(isDesktop));
    tabMobile.setAttribute('aria-selected', String(!isDesktop));
    frameDesktop.hidden = !isDesktop;
    frameMobile.hidden = isDesktop;
    contextLabel.textContent = isDesktop
      ? 'Modal de Qualtrics sobre el Portal'
      : 'Bottom sheet nativo en la App';
  }

  tabDesktop.addEventListener('click', function(){ show('desktop'); });
  tabMobile.addEventListener('click', function(){ show('mobile'); });
</script>

</body>
</html>
